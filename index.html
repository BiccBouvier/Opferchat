<script>const APPV='f343c3f1';const CHANGES={"de": ["Update-Kanal: Im neuen Chat „Updates“ schreiben nur Owner. Alle können lesen, reagieren und abstimmen.", "Moderatoren: Admins heißen jetzt Moderatoren und löschen nur noch Nachrichten im Public Chat. Bannen und Gruppen löschen kann nur der Owner.", "Public Chat: Er wird nicht mehr um Mitternacht geleert. Deine eigenen Nachrichten kannst du dort nur noch für dich löschen.", "Geburtstag: Alle sehen an deinem Geburtstag einen Kuchen neben deinem Namen, und dein Profil ist voller Konfetti.", "Reaktionen: Neue Standard-Emojis 😂 🫩 💀 🥀 😭 😒. Unter Einstellungen → Reaktionen suchst du dir deine eigenen aus.", "Bilder: Beim Bild-Knopf wählst du jetzt zwischen Kamera und Foto.", "Status: Neu sind „Arbeit“ und „Urlaub“."], "en": ["Update channel: Only Owners write in the new “Updates” chat. Everyone can read, react and vote.", "Moderators: Admins are now called moderators and can only delete messages in the Public Chat. Only the Owner can ban people and delete groups.", "Public Chat: It's no longer cleared at midnight. You can only delete your own messages there for yourself.", "Birthdays: On your birthday everyone sees a cake next to your name, and your profile is full of confetti.", "Reactions: New default emojis 😂 🫩 💀 🥀 😭 😒. Pick your own under Settings → Reactions.", "Photos: The photo button now lets you choose between camera and photo.", "Status: “Working” and “On vacation” are new."], "es": ["Canal de novedades: en el nuevo chat «Novedades» solo escriben los Owners. Todos pueden leer, reaccionar y votar.", "Moderadores: los admins ahora se llaman moderadores y solo eliminan mensajes del chat público. Solo el Owner puede banear y eliminar grupos.", "Chat público: ya no se vacía a medianoche. Tus propios mensajes allí solo los puedes eliminar para ti.", "Cumpleaños: el día de tu cumpleaños todos ven una tarta junto a tu nombre, y tu perfil se llena de confeti.", "Reacciones: nuevos emojis predeterminados 😂 🫩 💀 🥀 😭 😒. Elige los tuyos en Ajustes → Reacciones.", "Fotos: con el botón de foto ahora eliges entre cámara y foto.", "Estado: hay dos nuevos, «Trabajando» y «De vacaciones»."], "eo": ["Novaĵ-kanalo: en la nova babilejo „Novaĵoj“ skribas nur Owner-oj. Ĉiuj povas legi, reagi kaj voĉdoni.", "Moderigantoj: adminoj nun nomiĝas moderigantoj kaj forigas nur mesaĝojn en la publika babilejo. Nur la Owner povas forbari kaj forigi grupojn.", "Publika babilejo: ĝi ne plu malpleniĝas je noktomezo. Viajn proprajn mesaĝojn tie vi povas forigi nur por vi.", "Naskiĝtagoj: en via naskiĝtago ĉiuj vidas kukon apud via nomo, kaj via profilo estas plena de konfetoj.", "Reagoj: novaj defaŭltaj emoĝioj 😂 🫩 💀 🥀 😭 😒. Elektu viajn proprajn en Agordoj → Reagoj.", "Bildoj: per la bild-butono vi nun elektas inter kamerao kaj foto.", "Stato: novaj estas „Laboras“ kaj „Feriumas“."], "ru": ["Канал обновлений: в новом чате «Обновления» пишут только Owner. Все могут читать, реагировать и голосовать.", "Модераторы: админы теперь называются модераторами и удаляют только сообщения в общем чате. Банить и удалять группы может только Owner.", "Общий чат: он больше не очищается в полночь. Свои сообщения там можно удалить только для себя.", "День рождения: в твой день рождения все видят торт рядом с твоим именем, а твой профиль полон конфетти.", "Реакции: новые стандартные эмодзи 😂 🫩 💀 🥀 😭 😒. Свои можно выбрать в Настройки → Реакции.", "Фото: кнопка фото теперь предлагает выбрать между камерой и фото.", "Статус: новые статусы «Работаю» и «В отпуске»."]};//c
</script>

<style>
/* Konzept: Schulheft. Kariertes Papier, Kuli-Tinte, Textmarker als Akzent, Schriftzug mit Edding. */
:root{
--hl:#ffe14d;--on-hl:#1d2340;
--paper:#f5f6fa;--sheet:#ffffff;--ink:#1d2340;--ink2:#5c6283;--line:#e0e3ee;--grid:rgba(29,35,64,.065);
--blue:#2747d0;--red:#d33a2c;--green:#1f9254;--gold:#c48a00;--teal:#0d8a79;--veil:rgba(20,24,46,.45);
--mk-fg:var(--ink);--mk-bg:var(--hl-swash,var(--hl));
--sel:color-mix(in srgb,var(--hl) 24%,transparent);--promo:color-mix(in srgb,var(--hl) 30%,var(--sheet));--pub-bg:#1d2340;--pub-fg:var(--hl);
--f-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
--f-mark:"Permanent Marker","Marker Felt","Bradley Hand","Segoe Print",cursive;
color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#12152a;--sheet:#1b1f37;--ink:#e8ebf7;--ink2:#9da3c0;--line:#2c3152;--grid:rgba(232,235,247,.045);--blue:#8ea5ff;--red:#ff7062;--green:#4fd18c;--gold:#f0c04a;--teal:#43d1bd;--veil:rgba(0,0,0,.6);--mk-fg:var(--hl-bright,var(--ink));--mk-bg:transparent;--sel:color-mix(in srgb,var(--hl) 12%,transparent);--promo:color-mix(in srgb,var(--hl) 11%,var(--sheet));--pub-bg:var(--hl);--pub-fg:var(--on-hl);color-scheme:dark}}
:root[data-theme="dark"]{--paper:#12152a;--sheet:#1b1f37;--ink:#e8ebf7;--ink2:#9da3c0;--line:#2c3152;--grid:rgba(232,235,247,.045);--blue:#8ea5ff;--red:#ff7062;--green:#4fd18c;--gold:#f0c04a;--teal:#43d1bd;--veil:rgba(0,0,0,.6);--mk-fg:var(--hl-bright,var(--ink));--mk-bg:transparent;--sel:color-mix(in srgb,var(--hl) 12%,transparent);--promo:color-mix(in srgb,var(--hl) 11%,var(--sheet));--pub-bg:var(--hl);--pub-fg:var(--on-hl);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--paper);color:var(--ink);font:15px/1.4 var(--f-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
input,textarea{font-size:16px}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.ic{display:inline-flex;align-items:center;flex:none}
.grid{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px}

#app{position:fixed;left:0;right:0;top:0;height:100%;margin:0 auto;display:flex;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.kb #app{padding-bottom:0}
#app>section{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}

/* Schriftzug */
.mark{font-family:var(--f-mark);font-weight:400;line-height:1.05;color:var(--mk-fg);isolation:isolate;margin:0;letter-spacing:.01em}
.mark span{position:relative;display:inline-block;padding:0 .05em}
.mark span::after{content:"";position:absolute;left:-.1em;right:-.16em;bottom:.05em;height:.46em;background:var(--mk-bg);border-radius:.25em .55em .35em .6em;transform:rotate(-1.6deg);z-index:-1}

/* Kopfzeilen */
.top,.ch{display:flex;align-items:center;gap:4px;background:var(--sheet);border-bottom:1px solid var(--line);padding:8px 8px 8px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));min-height:58px}
.top .mark{flex:1;font-size:26px;min-width:0}
.ch{padding-left:max(6px,env(safe-area-inset-left,0px));gap:8px}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:42px;height:42px;padding:0 9px;border:0;border-radius:12px;background:transparent;color:var(--ink);flex:none}
.ib:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.ib:active{background:color-mix(in srgb,var(--ink) 12%,transparent)}
#onl{font-size:13px;font-weight:650;font-variant-numeric:tabular-nums}

/* Chatliste */
#cl{flex:1;overflow-y:auto;background:var(--sheet);padding-bottom:96px}
.cr{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));cursor:pointer;position:relative}
.cr::after{content:"";position:absolute;left:74px;right:0;bottom:0;border-bottom:1px solid var(--line)}
.cr:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.cr.on{background:var(--sel)}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#1d2340;background:var(--paper)}
.av.g{border-radius:14px}
.av.pub{background:var(--pub-bg);color:var(--pub-fg)}
.av.upd{background:var(--hl);color:var(--on-hl)}
.av.big{width:72px;height:72px;font-size:28px}
.av.sm{width:40px;height:40px;color:var(--ink);background:var(--paper);border:1px solid var(--line)}
.ch .av{width:38px;height:38px;font-size:15px}
.ch .av .i{width:19px;height:19px}
.ci{flex:1;min-width:0}
.ci>b{display:flex;align-items:center;gap:6px;font-weight:650;font-size:15.5px;min-width:0}
.ci .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinI{color:var(--ink2)}.pinI .i{width:15px;height:15px}
.ci .p{display:flex;align-items:center;gap:4px;color:var(--ink2);font-size:14px;margin-top:2px;min-width:0}
.ci .p>span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .p .i{width:15px;height:15px}
.pf{flex:none;white-space:nowrap}
.cm{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;flex:none}
.cm.u{color:var(--ink);font-weight:650}
.bd{min-width:21px;height:21px;padding:0 6px;border-radius:11px;background:var(--hl);color:var(--on-hl);font-size:12px;font-weight:750;display:inline-flex;align-items:center;justify-content:center}
#fab{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:18px;width:58px;height:58px;border:0;border-radius:18px;background:var(--hl);color:var(--on-hl);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px -8px var(--veil)}
#fab .i{width:25px;height:25px}

/* Chat */
#cav{display:flex}
.ct{flex:1;min-width:0}
.ct b{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:650;white-space:nowrap;overflow:hidden}
.ct small{display:block;color:var(--ink2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list{flex:1;overflow-y:auto;padding:10px 12px 6px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:2px;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;background-attachment:local}
.m{max-width:min(80%,560px);align-self:flex-start;display:flex;flex-direction:column;align-items:flex-start;touch-action:pan-y}
.m.me{align-self:flex-end;align-items:flex-end}
.nm{font-size:12.5px;font-weight:650;margin:8px 10px 2px;color:var(--blue);cursor:pointer;display:flex;align-items:center;gap:4px}
.b{background:var(--sheet);color:var(--ink);padding:7px 11px 8px;border-radius:4px 15px 15px 15px;border:1px solid var(--line);overflow-wrap:anywhere;white-space:pre-wrap;font-size:15.5px;line-height:1.38;max-width:100%}
.me .b{background:var(--hl);color:var(--on-hl);border-color:transparent;border-radius:15px 4px 15px 15px}
.b.bi{padding:4px 4px 6px}
.b.bi>:not(.pic){padding:0 6px}
.b.dl,.me .b.dl{background:var(--sheet);color:var(--ink2);border:1px dashed var(--line);font-style:italic;display:flex;gap:7px;align-items:flex-start;white-space:normal}
.b.dl .i{width:17px;height:17px;margin-top:2px}
.q{border-left:3px solid currentColor;background:color-mix(in srgb,currentColor 9%,transparent);padding:4px 8px;margin-bottom:5px;border-radius:6px;font-size:13px;white-space:normal;cursor:pointer;opacity:.92}
.q b{display:block;font-size:12.5px}
.pic{display:block;max-width:100%;max-height:340px;border-radius:11px;margin-bottom:4px;cursor:zoom-in}
.mt{font-size:11px;color:var(--ink2);margin:3px 8px 5px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.tk{display:inline-flex;align-items:center;gap:3px}
.tk .i{width:16px;height:16px}
.tk.rd{color:var(--blue)}
.rx{display:flex;gap:4px;flex-wrap:wrap;margin:3px 6px 0}
.rx button{background:var(--sheet);border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:13px;line-height:1.5}
.rx button.my{border-color:var(--ink)}
.ab{display:flex;align-items:center;gap:1px;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:3px;margin:5px 0 2px;box-shadow:0 8px 20px -10px var(--veil)}
.ab button{border:0;background:none;padding:5px 6px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.ab button.em{font-size:20px;line-height:1}
.ab button:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.ab button .i{width:20px;height:20px}
.day{align-self:center;font-size:12px;color:var(--ink2);background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:3px 10px;margin:10px 0 6px;position:sticky;top:2px;z-index:1}
.empty{margin:auto;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink2);text-align:center;padding:24px}
.empty .i{width:40px;height:40px;stroke-width:1.6}
.empty p{margin:0;max-width:26ch}
.older{align-self:center;margin:4px 0 8px}
.sn .m,.sn .m.me{align-self:stretch;max-width:100%;align-items:stretch;--sc:var(--blue)}
.sn .m.me{--sc:var(--red)}
.sn .nm{margin:10px 0 2px 12px;color:var(--sc);font-size:12px;font-weight:750;letter-spacing:.04em;text-transform:uppercase}
.sn .b,.sn .me .b{background:none;color:var(--ink);border:0;border-left:3px solid var(--sc);border-radius:0;padding:1px 0 1px 10px;margin-left:2px}
.sn .b.dl{border-left:3px dashed var(--line)}
.sn .mt,.sn .rx,.sn .ab{margin-left:12px}
.sn .ab{align-self:flex-start}
#ty:empty{min-height:0;padding:0}
#ty{min-height:24px;padding:2px 16px;font-size:12.5px;color:var(--ink2);display:flex;align-items:center;background:var(--paper)}
.tp{display:inline-flex;align-items:center;gap:7px}
.tp b{color:var(--ink);font-weight:650}
.dots{display:inline-flex;gap:3px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--ink2);animation:bn 1.1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bn{0%,70%,100%{transform:translateY(0);opacity:.45}35%{transform:translateY(-3px);opacity:1}}
@keyframes mv{from{background-position:0 0}to{background-position:200% 0}}
@keyframes hu{to{filter:hue-rotate(360deg)}}
#rp{display:flex;align-items:center;gap:8px;margin:0 10px 6px;padding:6px 4px 6px 10px;border-left:3px solid var(--hl);background:var(--sheet);border-radius:8px;font-size:13px;color:var(--ink2)}
.rpt{flex:1;min-width:0}
.rpt b{display:block;color:var(--ink);font-size:12.5px}
.rpt span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cmp{display:flex;gap:6px;align-items:flex-end;padding:8px 10px 10px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));background:var(--sheet);border-top:1px solid var(--line)}
#cmp .ib{height:44px;min-width:44px}
#in{flex:1;min-width:0;resize:none;max-height:140px;border:1.5px solid var(--line);background:var(--paper);border-radius:21px;padding:9px 15px;outline:0;line-height:1.35}
#in:focus{border-color:var(--ink2)}
#go{flex:none;width:44px;height:44px;border:0;border-radius:50%;background:var(--hl);color:var(--on-hl);display:flex;align-items:center;justify-content:center}
#an.on{background:var(--ink);color:var(--sheet)}
#none{display:none}
#cv.empty>*{display:none!important}
#cv.empty>#none{display:flex!important;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--ink2);text-align:center;padding:24px}
#none .i{width:46px;height:46px;stroke-width:1.5}
#none p{margin:0}

/* Zwei Spalten am PC */
@media (min-width:900px){
 #app{max-width:1280px}
 body.in #lv{display:flex!important;flex:0 0 370px;border-right:1px solid var(--line)}
 body.in #cv{display:flex!important}
 #bk{display:none!important}
}

/* Blätter */
.ov{position:fixed;inset:0;background:var(--veil);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sc{background:var(--sheet);color:var(--ink);width:100%;max-width:520px;max-height:88%;overflow-y:auto;border-radius:20px 20px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.sc::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.ov.c{align-items:center}
.ov.c .sc{border-radius:20px;width:calc(100% - 32px);padding-top:18px}
.ov.c .sc::before{display:none}
@media (min-width:640px){.ov{align-items:center}.sc{border-radius:20px;max-height:84%;padding-top:18px}.sc::before{display:none}}
.sc h3{margin:4px 0 12px;font-size:20px;font-weight:750;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.cnt{font-size:14px;font-weight:600;color:var(--ink2)}
.sc label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:16px 0 6px}
.fld,.sc input[type=text],.sc input[type=password],.sc input[type=search]{width:100%;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:11px 12px;outline:0}
.fld:focus,.sc input:focus{border-color:var(--ink2)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;border:0;border-radius:12px;padding:13px 14px;font-weight:650;background:var(--ink);color:var(--sheet);text-align:center}
.btn.hl{background:var(--hl);color:var(--on-hl)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.red{background:var(--red);color:#fff}
.btn.sm{width:auto;margin:0;padding:11px 14px;flex:none}
.btn:disabled{opacity:.55;cursor:default}
.line2{display:flex;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:7px 12px;border-radius:10px;font-weight:550;font-size:14px}
.chip .i{width:17px;height:17px}
.chip.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
a.chip{text-decoration:none}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw.on{outline:2px solid var(--ink);outline-offset:2px}
.cpick{-webkit-appearance:none;appearance:none;width:32px;height:32px;padding:0;border:2px dashed var(--ink2);border-radius:50%;background:transparent;cursor:pointer;overflow:hidden}
.cpick::-webkit-color-swatch-wrapper{padding:2px}.cpick::-webkit-color-swatch{border:0;border-radius:50%}.cpick::-moz-color-swatch{border:0;border-radius:50%}
.row{display:flex;align-items:center;gap:12px;padding:10px 2px;border:0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:transparent;color:var(--ink);text-align:left}
.row:last-child{border-bottom:0}
.row.flat{cursor:default}
.row.act b{display:block;font-weight:650}
.row small{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:12.5px;margin-top:1px}
.grow{flex:1;min-width:0}
.nmr{display:flex;align-items:center;gap:6px;font-weight:600;min-width:0;flex-wrap:wrap}
.bdg{display:inline-flex;gap:2px;align-items:center}
.bdg .i{width:16px;height:16px}
.bo{color:var(--gold)}.ba{color:var(--blue)}.bp{color:var(--teal)}.bl{color:var(--ink2)}
.you{font-size:11.5px;font-weight:650;color:var(--ink2);border:1px solid var(--line);border-radius:6px;padding:0 5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none;display:inline-block}
.dot.on{background:var(--green)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--ink2);flex:none}
.st .i{width:17px;height:17px}
.srch{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:0 10px;margin-bottom:4px;color:var(--ink2)}
.srch .i{width:19px;height:19px}
.sc .srch input{border:0;background:transparent;padding:10px 0;flex:1}
.prof{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;margin:4px 0 8px;position:relative}
.sc{position:relative}
.pcf{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;border-radius:inherit}
.pcf~*{position:relative;z-index:1}
.pcf i{position:absolute;top:-14px;width:7px;height:11px;border-radius:2px;opacity:.85;animation:pcf linear infinite}
@keyframes pcf{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--x),105vh) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){.pcf i{animation:none;transform:translateY(var(--y)) rotate(var(--r))}}
.camv{width:100%;max-height:52vh;border-radius:12px;background:#000;display:block;margin:0 0 10px;object-fit:cover}
.rxs button.on{background:var(--sel);box-shadow:inset 0 0 0 2px var(--hl)}
.pname{display:flex;align-items:center;gap:6px;font-size:20px;font-weight:700;flex-wrap:wrap;justify-content:center}
.full{width:100%;border-radius:12px;display:block}
.tile{border-bottom:1px solid var(--line)}
.tile summary{display:flex;align-items:center;gap:12px;padding:14px 2px;font-weight:600;cursor:pointer;list-style:none}
.tile summary::-webkit-details-marker{display:none}
.tile summary .chev{margin-left:auto;color:var(--ink2);transition:transform .2s}
.tile[open] summary .chev{transform:rotate(90deg)}
.tin{padding:0 2px 18px}
.tin>label:first-child{margin-top:0}
.mut{color:var(--ink2);font-size:13.5px;margin:0}
.fine{color:var(--ink2);font-size:13px;margin:10px 0 0;line-height:1.45}
.fine .ic{display:inline-flex;vertical-align:-3px;margin-right:4px}.fine .i{width:16px;height:16px}
.ctr{text-align:center}
.foot{margin-top:16px}
.promo{position:relative;margin:12px 14px 6px;padding:14px 16px;border-radius:14px;background:var(--promo);color:var(--ink)}
.sc .promo{margin:16px 0 0}
.promo>b{display:flex;align-items:center;gap:7px;font-size:15.5px}
.promo>b .i{width:19px;height:19px}
.promo p{margin:5px 0 10px;color:var(--ink2);font-size:13.5px;line-height:1.45;padding-right:24px}
.promo .chip{background:var(--sheet);border-color:transparent}
.promo .chip.on{background:var(--ink);color:var(--sheet)}
.promo .x{position:absolute;top:6px;right:6px;min-width:34px;height:34px}
.prev{max-width:100%;margin-top:10px}
.nprev{margin:10px 0 0;font-size:18px;font-weight:700}
.banic{display:flex;justify-content:center;color:var(--red);margin-top:4px}.banic .i{width:44px;height:44px}

/* Anmeldung */
#av{overflow-y:auto;background-color:var(--paper);background-image:linear-gradient(90deg,transparent 30px,color-mix(in srgb,var(--red) 50%,transparent) 30px 32px,transparent 32px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:auto,20px 20px,20px 20px}
@media (min-width:640px){#av{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px}}
.au{width:100%;max-width:410px;margin:auto;padding:30px 20px 26px;padding-left:max(44px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){.au{padding-left:20px}}
.hero{font-size:clamp(48px,15vw,64px);align-self:center;margin:6px 0 0;transform:rotate(-3deg)}
.sub{color:var(--ink2);text-align:center;margin:0 0 6px;font-size:15px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card .btn{margin-top:2px}
.card .fine{margin-top:0}
.seg{display:flex;padding:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-bottom:4px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;font-weight:650;color:var(--ink2)}
.seg button.on{background:var(--sheet);color:var(--ink);box-shadow:0 1px 0 var(--line),0 2px 6px -3px var(--veil)}
.pw{position:relative}
.pw .fld{padding-right:48px}
.pw .ib{position:absolute;right:3px;top:50%;transform:translateY(-50%);color:var(--ink2)}
.aerr{color:var(--red);font-size:13.5px;min-height:1.1em;line-height:1.4}
.aerr:empty{display:none}
.more{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.more .fine{margin:0}
.social{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sl{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--sheet);color:var(--ink);text-decoration:none;min-width:0}
.sl:hover{border-color:var(--ink2)}
.lg{display:inline-block;flex:none;width:28px;height:28px;background:currentColor;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.sl>span:last-child{min-width:0}
.sl b{display:block;font-size:14.5px}
.sl small{display:block;font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tin .social{margin-top:2px}

#ts{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translate(-50%,-8px);background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:12px;font-weight:600;z-index:9;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:calc(100% - 32px);text-align:center}
#ts.on{opacity:1;transform:translate(-50%,0)}
#er{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--red);color:#fff;padding:10px 12px;border-radius:12px;font-size:13px;word-break:break-word}

/* ---------- Neu: Profilbilder, Flammen, Erwähnungen, Links, Menüs ---------- */
.av{background-size:cover;background-position:center;overflow:hidden}
.av.img{color:transparent}
.av.gone{background:var(--line);color:var(--ink2)}
.av.bday{box-shadow:0 0 0 2px var(--sheet),0 0 0 4px var(--hl)}
.prof .av.big{width:96px;height:96px;font-size:38px}

.edl{background:none;border:0;padding:0;color:inherit;font:inherit;text-decoration:underline dotted;cursor:pointer}
.once{display:flex;align-items:center;gap:9px;font-weight:650;white-space:normal}
.once .i{width:22px;height:22px}
.once small{display:block;font-weight:400;opacity:.78;font-size:12.5px}
.b.oc{cursor:pointer;min-width:170px}
.vn{display:flex;align-items:center;gap:10px;min-width:190px;padding:2px 0;white-space:normal}
.vp{width:36px;height:36px;border-radius:50%;border:0;background:var(--ink);color:var(--sheet);display:flex;align-items:center;justify-content:center;flex:none}
.me .vp{background:var(--on-hl);color:var(--hl)}

.vw{flex:1;height:4px;border-radius:2px;background:color-mix(in srgb,currentColor 25%,transparent);overflow:hidden}
.vw i{display:block;height:100%;width:0;background:currentColor}
.vd{font-size:12px;font-variant-numeric:tabular-nums;opacity:.8}
#mx{display:flex;flex-direction:column;margin:0 10px 6px;background:var(--sheet);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 8px 20px -12px var(--veil)}
#mx button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:7px 10px;text-align:left;color:var(--ink)}
#mx button+button{border-top:1px solid var(--line)}
#mx .av{width:30px;height:30px;font-size:13px}
#blk{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--sheet);border-top:1px solid var(--line);color:var(--ink2);font-size:13.5px;line-height:1.4}
#blk b{color:var(--ink)}
#rec{flex:1;display:flex;align-items:center;gap:10px;min-height:44px;padding:0 6px;color:var(--ink2);font-variant-numeric:tabular-nums}
#rec b{color:var(--ink);font-weight:650}
.rdot{width:10px;height:10px;border-radius:50%;background:var(--red);animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:.25}}
.emr{display:flex;justify-content:space-between;gap:2px;padding:0 0 8px;border-bottom:1px solid var(--line);margin-bottom:2px}
.emr button{flex:1;border:0;background:none;font-size:26px;line-height:1;padding:9px 0;border-radius:12px}
.emr button.on{background:var(--sel)}
.mpv{font-size:13.5px;color:var(--ink2);margin:0 0 10px;padding:8px 10px;border-left:3px solid var(--hl);background:var(--paper);border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.a2{padding:13px 2px;font-weight:600}
.row.a2>.ic{color:var(--ink2)}
.row.a2.red,.row.a2.red>.ic{color:var(--red)}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(68px,1fr));gap:8px;margin:12px 0 4px}
.act{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;min-width:0;overflow-wrap:anywhere;hyphens:auto;border:1.5px solid var(--line);border-radius:14px;background:transparent;color:var(--ink);font-size:12.5px;font-weight:600;line-height:1.2;text-align:center}
.act.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.act.red{color:var(--red)}
.inf .row{cursor:default;align-items:flex-start}
.inf .row>.ic{color:var(--ink2);margin-top:1px}
.inf small{display:block;color:var(--ink2);font-size:12px;margin:0 0 1px}
.bio{white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 0;max-width:38ch}
.lnks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:6px}
.lk{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:12px;color:var(--ink);text-decoration:none;min-width:0;background:transparent;font-size:13.5px;text-align:left}
.lk>span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk>.ic,.lk>.lg{color:var(--ink2)}
.lk .lg,.lkr .lg{width:22px;height:22px}
.ban2{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;margin:10px 0 2px;font-size:13.5px;line-height:1.4;text-align:left;width:100%}
.ban2.r{background:color-mix(in srgb,var(--red) 13%,transparent)}
.ban2.r>.ic{color:var(--red)}
.ban2.y{background:var(--promo)}
.ban2 .grow>b{display:block}
.sec{font-size:12px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:20px 0 4px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:650;border:1px solid var(--line);border-radius:7px;padding:1px 6px;color:var(--ink2);white-space:nowrap}
.tag .i{width:14px;height:14px}
.pfh{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin:16px 0 6px}
.sc .pfh label{margin:0}
.vis{flex:none;display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line);background:transparent;color:var(--ink2);border-radius:9px;padding:4px 8px;font-size:12px;font-weight:650}
.vis .i{width:15px;height:15px}
.vis.k{color:var(--ink);border-color:var(--ink2)}
.lkr{display:flex;gap:8px;align-items:center;margin-top:8px}
.lkr>.ic{color:var(--ink2)}
.lkr .fld{flex:1;min-width:0;padding:9px 11px}
.avr{display:flex;align-items:center;gap:14px;margin-bottom:4px}
.avr .av{width:72px;height:72px;font-size:28px}
textarea.fld{resize:vertical;min-height:64px;line-height:1.4;display:block}
.sc input[type=date]{width:100%;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:10px 12px;outline:0;min-height:44px}
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.skin{border:2px solid var(--line);border-radius:14px;padding:0;overflow:hidden;background:var(--sheet);color:var(--ink);font-size:12.5px;font-weight:650;text-align:center}
.skin.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.skin>i{display:flex;flex-direction:column;justify-content:center;gap:5px;height:58px;padding:0 10px}
.skin>i b{display:block;height:9px;border-radius:5px;width:62%}
.skin>i b+b{align-self:flex-end;width:46%}
.skin>span{display:block;padding:6px 4px}
.prow{border-bottom:0;padding-top:4px}
.prow b{display:block;font-weight:700}
.supl{display:flex;flex-direction:column;gap:2px;max-height:46vh;overflow-y:auto;padding:4px 0 10px}
.supl .m{max-width:88%}
.supi{display:flex;gap:8px;align-items:flex-end}
.supi textarea{flex:1;min-width:0;min-height:44px}
.cf{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.cf i{position:absolute;top:-14px;width:8px;height:13px;border-radius:2px;animation:cf var(--d) cubic-bezier(.25,.6,.45,1) forwards}
@keyframes cf{to{transform:translate(var(--x),106vh) rotate(var(--r))}}
@media (hover:none){.m .b{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}}
.noshot{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}

const normName=s=>String(s||'').replace(/[\u0000-\u001f\u007f]/g,'').trim().replace(/\s+/g,' ');
const badKey=k=>/[.#$\[\]\/]/.test(k);
function nameProblem(n,plus){
  if(!n)return 'Bitte gib einen Namen ein.';
  if(n.length>20)return 'Der Name darf höchstens 20 Zeichen lang sein.';
  if(badKey(n))return 'Diese Zeichen gehen nicht im Namen: . # $ [ ] /';
  if(ER.test(n)&&!plus)return 'Emojis im Namen gibt es nur mit Plus.';
  return ''}
function pwProblem(p,p2){if(!p||p.length<6)return 'Das Passwort braucht mindestens 6 Zeichen.';if(p2!==undefined&&p!==p2)return 'Die beiden Passwörter sind nicht gleich.';return ''}
function genEmail(){const a='abcdefghijklmnopqrstuvwxyz0123456789',r=crypto.getRandomValues(new Uint8Array(18));let s='u';for(const x of r)s+=a[x%36];return s+'@'+(altMail?'opferchat.example.com':'opferchat.invalid')}
const nameEntry=async k=>(await fb.ref('names/'+k).once('value')).val();
const TAKEN={userMsg:'Den Namen hat schon jemand. Such dir einen anderen aus.'};
function authMsg(e){const c=(e&&e.code)||'',all=c+' '+((e&&e.message)||'');
  if(e&&e.userMsg)return e.userMsg;
  if(/wrong-password|invalid-credential|invalid-login-credentials|user-not-found/.test(c))return 'Das Passwort stimmt nicht.';
  if(/too-many-requests/.test(c))return 'Zu viele Versuche. Warte kurz und versuch es dann nochmal.';
  if(/weak-password/.test(c))return 'Das Passwort braucht mindestens 6 Zeichen.';
  if(/network-request-failed/.test(c))return 'Keine Verbindung. Prüf dein Internet und versuch es nochmal.';
  if(/operation-not-allowed|admin-restricted-operation/.test(c))return 'Die Anmeldung mit Passwort ist in Firebase noch nicht aktiviert (Authentication, Anmeldemethode, E-Mail/Passwort).';
  if(/permission[_ -]?denied/i.test(all))return 'Die Firebase-Regeln sind noch nicht aktualisiert. Füg zuerst die neuen Regeln ein.';
  if(/requires-recent-login/.test(c))return 'Melde dich einmal ab und wieder an und versuch es dann nochmal.';
  return 'Das hat nicht geklappt ('+(c||(e&&e.message)||'unbekannter Fehler')+').'}
async function claimName(n,full){
  const key=n.toLowerCase(),me=users[uid],oldKey=me?.name?me.name.toLowerCase():null;
  const ex=await nameEntry(key);
  if(ex&&ex.uid!==uid)throw TAKEN;
  const e=firebase.auth().currentUser?.email||ex?.e||genEmail(),o={};
  if(full)o['users/'+uid]={name:n,status:'Zuhause',seen:N(),accent:A,v:2};else o['users/'+uid+'/name']=n;
  if(!ex)o['names/'+key]={uid,e};
  if(oldKey&&oldKey!==key&&!badKey(oldKey)){const old=await nameEntry(oldKey).catch(()=>null);if(old&&old.uid===uid)o['names/'+oldKey]=null}
  try{await fb.ref().update(o)}catch(x){throw /permission/i.test((x&&(x.code||x.message))||'')?TAKEN:x}
  if(me)me.name=n;else users[uid]={id:uid,name:n,status:'Zuhause',seen:N(),accent:A,v:2};
  return e}

async function doLogin(){
  if(authBusy)return;const n=normName($('#un').value),pw=$('#pw').value;
  if(!n||!pw){aErr('Gib deinen Namen und dein Passwort ein.');return}
  const key=n.toLowerCase();if(badKey(key)){aErr('Diesen Namen gibt es nicht.');return}
  aErr('');busy(true);
  try{const ex=await nameEntry(key);
    if(!ex){busy(false);aErr('Diesen Namen gibt es nicht. Neu hier? Dann registrier dich.');return}
    authBusy=true;const cr=await firebase.auth().signInWithEmailAndPassword(ex.e,pw);authBusy=false;start(cr.user)}
  catch(e){authBusy=false;busy(false);aErr(authMsg(e))}}
async function doRegister(){
  if(authBusy)return;
  const n=normName($('#un').value),pw=$('#pw').value,pw2=$('#pw2').value,p=nameProblem(n,false)||pwProblem(pw,pw2);
  if(p){aErr(p);return}
  aErr('');busy(true);authBusy=true;const key=n.toLowerCase();let u=null;
  try{
    if(await nameEntry(key))throw TAKEN;
    let email=genEmail(),cred;
    try{cred=await firebase.auth().createUserWithEmailAndPassword(email,pw)}
    catch(e){if(e&&e.code=='auth/invalid-email'){altMail=true;email=genEmail();cred=await firebase.auth().createUserWithEmailAndPassword(email,pw)}else throw e}
    u=cred.user;
    const us=(await fb.ref('users').once('value')).val()||{};
    if(Object.entries(us).some(([k,v])=>k!==u.uid&&v&&typeof v.name=='string'&&v.name.toLowerCase()===key))throw TAKEN;
    try{await fb.ref().update({['names/'+key]:{uid:u.uid,e:email},['users/'+u.uid]:{name:n,status:'Zuhause',seen:Date.now(),accent:A,v:2}})}
    catch(e){throw /permission/i.test((e&&(e.code||e.message))||'')?TAKEN:e}
    authBusy=false;start(u);
  }catch(e){
    if(u){try{await u.delete()}catch(x){try{await firebase.auth().signOut()}catch(y){}}}
    authBusy=false;busy(false);aErr(authMsg(e));
  }}

const LEGAL={i:"<h2>Impressum</h2><h3>Angaben gemäß § 5 DDG</h3><p>Marlin Fräger<br>Pfarrstraße 100a<br>35102 Lohra</p><h3>Kontakt</h3><p>E-Mail: opferchat@outlook.com<br>Telefon: +49 163 9050185</p><h3>Verantwortlich für den Inhalt nach § 18 Abs. 2 MStV</h3><p>Marlin Fräger, Anschrift wie oben</p><h3>Hinweis zu Inhalten der Nutzer</h3><p>Nachrichten, Bilder, Sprachnachrichten und Profile in Opferchat stammen von den jeweiligen Nutzern. Für diese Inhalte sind die Nutzer selbst verantwortlich. Rechtswidrige Inhalte kannst du in der App melden (Einstellungen, Hilfe und Feedback) oder per E-Mail an die oben genannte Adresse. Wir prüfen Meldungen und entfernen solche Inhalte.</p><h3>Haftung für Links</h3><p>Für Inhalte externer Seiten, auf die Opferchat verlinkt, sind ausschließlich deren Betreiber verantwortlich. Zum Zeitpunkt der Verlinkung waren keine Rechtsverstöße erkennbar.</p>",d:"<h2>Datenschutzerklärung</h2><h3>1. Verantwortlicher</h3><p>Marlin Fräger, Pfarrstraße 100a, 35102 Lohra<br>E-Mail: opferchat@outlook.com, Telefon: +49 163 9050185</p><h3>2. Was wir speichern</h3><p>Beim Registrieren: Benutzername und Passwort (das Passwort speichert Firebase nur verschlüsselt, wir sehen es nie). Bei der Nutzung: deine Nachrichten, Bilder, Sprachnachrichten, Gruppen, Kontakte, Blockierungen, Meldungen, Flammen-Serien, Anmelde-Serie und der Zeitpunkt, wann du zuletzt online warst. Freiwillig: Profilbild, Beschreibung, Alter oder Geburtstag, Geschlecht, Wohnort, Beziehungsstatus, Vor- und Nachname und Links zu deinen Social-Media-Konten, Telefonnummer und E-Mail. Bei jedem dieser Profilfelder legst du fest, ob es Alle oder nur deine Kontakte sehen. Deinen vollständigen Geburtstag sehen andere nie, nur Tag und Monat oder dein Alter. Wenn du einen Geburtstag eingetragen hast, sehen an diesem Tag alle einen Kuchen neben deinem Namen.</p><h3>3. Wozu und auf welcher Grundlage</h3><p>Wir brauchen die Daten, damit der Chat funktioniert (Art. 6 Abs. 1 lit. b DSGVO). Freiwillige Profilangaben speichern wir, weil du sie selbst eingibst (Einwilligung, Art. 6 Abs. 1 lit. a DSGVO). Du kannst sie jederzeit ändern oder löschen. Für Sicherheit und Missbrauchsschutz, zum Beispiel Sperren und Meldungen, nutzen wir unser berechtigtes Interesse (Art. 6 Abs. 1 lit. f DSGVO).</p><h3>4. Wer die Daten verarbeitet</h3><p>Firebase (Google Ireland Limited, Gordon House, Barrow Street, Dublin 4, Irland, und Google LLC, USA) speichert Konten und Chat-Daten. GitHub, Inc. (USA) hostet die Webseite über GitHub Pages, und die Domain läuft über Strato. Dabei können Daten in Länder außerhalb der EU übertragen werden. Google und GitHub stützen sich dafür auf die EU-Standardvertragsklauseln beziehungsweise das EU-US Data Privacy Framework. Beim Aufruf der Seite werden zudem die Schriftart von Google Fonts geladen. Dabei erhält Google deine IP-Adresse.</p><h3>5. Wer deine Inhalte sieht</h3><p>Nachrichten sehen die Mitglieder des jeweiligen Chats. Im Public Chat und im Update-Kanal sehen sie alle angemeldeten Nutzer. Moderatoren und der Owner können Nachrichten im Public Chat löschen. Der Owner kann Meldungen und Ideen lesen, die du über Hilfe und Feedback schickst. Wir verkaufen keine Daten und geben sie nicht an Dritte weiter, außer wir sind gesetzlich dazu verpflichtet.</p><h3>6. Speicher auf deinem Gerät</h3><p>Die App speichert Einstellungen wie Design und Filter in deinem Browser (localStorage). Das ist für den Betrieb nötig. Wir nutzen keine Tracking- oder Analyse-Dienste.</p><h3>7. Speicherdauer und Löschung</h3><p>Wir speichern deine Daten, solange dein Konto besteht. Du kannst dein Konto in den Einstellungen unter „Konto löschen“ selbst löschen. Dabei werden auch deine Nachrichten, Privatchats und dein Profil gelöscht. Meldungen und Ideen, die du an den Owner geschickt hast, löschen wir auf Anfrage per E-Mail an die oben genannte Adresse. Einmalbilder werden nach dem Ansehen gelöscht. Nachrichten in Gruppen und Privatchats kannst du selbst löschen. Nachrichten im Public Chat löschen Moderatoren und der Owner. Wenn du dein Konto löschst, werden auch deine Nachrichten im Public Chat gelöscht.</p><h3>8. Deine Rechte</h3><p>Du hast das Recht auf Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung, Datenübertragbarkeit und Widerspruch. Eine erteilte Einwilligung kannst du jederzeit widerrufen. Schreib dafür an die E-Mail-Adresse oben. Du kannst dich außerdem bei einer Datenschutzbehörde beschweren, zum Beispiel beim Hessischen Beauftragten für Datenschutz und Informationsfreiheit, Postfach 3163, 65021 Wiesbaden.</p><h3>9. Alter</h3><p>Wenn du unter 16 bist, nutze Opferchat bitte nur mit Erlaubnis deiner Eltern.</p><h3>10. Werbung</h3><p>Aktuell gibt es keine Werbung. Wenn Werbung eingebunden wird, ergänzen wir diese Erklärung vorher.</p><p><small>Stand: November 2026</small></p>"};

Listener('resize',resize);resize();\n\n/* Jedes Partikel beh\u00e4lt seinen Farbplatz (Index % Farbanzahl) -> Anteile exakt 100 / 50 / 33 / 25 % */\nconst pickCol=i=>i%S.colors.length;\nfunction assignColors(){for(let i=0;i<n;i++)HB[i]=pickCol(i)}\n\nfunction spawnOne(x,y,vx,vy){\n  if(n>=CAP)return;\n  const i=n++;\n  X[i]=x!==undefined?x:(S.core?core.x+rnd(-20,20):rnd(0,W));\n  Y[i]=y!==undefined?y:(S.core?core.y+rnd(-20,20):rnd(0,H));\n  VX[i]=vx!==undefined?vx:rnd(-1,1);\n  VY[i]=vy!==undefined?vy:rnd(-1,1);\n  SZ[i]=S.size*rnd(.6,1.3);\n  HB[i]=pickCol(i);\n  SH[i]=Math.random()<.8?shape:(shape+1)%5;\n}\n\nfunction syncParticleCount(){\n  const target=Math.min(CAP,S.max);\n  while(n<target) spawnOne();\n  while(n>target) n--;\n}\n\nfunction respawn(i){\n  if(S.core){\n    const a=rnd(0,6.2832),s=rnd(.5,2);\n    X[i]=core.x+Math.cos(a)*core.r*.8;\n    Y[i]=core.y+Math.sin(a)*core.r*.8;\n    VX[i]=Math.cos(a)*s;VY[i]=Math.sin(a)*s;\n  }else{\n    X[i]=rnd(0,W);Y[i]=rnd(0,H);\n    VX[i]=rnd(-.8,.8);VY[i]=rnd(-.8,.8);\n  }\n  SZ[i]=S.size*rnd(.6,1.3);\n  HB[i]=pickCol(i);\n  SH[i]=Math.random()<.8?shape:(shape+1)%5;\n}\n\nfunction burst(x,y,k,sp){\n  for(let j=0;j<k;j++){\n    const idx=Math.floor(Math.random()*n);\n    if(idx<n){\n      const a=rnd(0,6.2832),s=rnd(.5,1)*sp;\n      X[idx]=x+Math.cos(a)*core.r*.8;\n      Y[idx]=y+Math.sin(a)*core.r*.8;\n      VX[idx]=Math.cos(a)*s;VY[idx]=Math.sin(a)*s;\n    }\n  }\n}\n\nfunction coreTap(){\n  shape=(shape+1)%5;\n  core.pulse=1;\n  burst(core.x,core.y,80,6);\n  syncUI();\n  if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}\n}\n\nfunction addHole(x,y){\n  for(let k=0;k<holes.length;k++){if(Math.hypot(holes[k].x-x,holes[k].y-y)<22){holes.splice(k,1);return}}\n  holes.push({x,y});\n  if(holes.length>10)holes.shift();\n}\n\nconst hint=$('#hint');\nconst hideHint=()=>{hint.style.opacity=0;hint.style.animation='none'};\nsetTimeout(hideHint,9000);\n\n/* Eingabe */\ncv.addEventListener('pointerdown',e=>{\n  try{cv.setPointerCapture(e.pointerId)}catch(_){}\n  const p={x:e.clientX,y:e.clientY,vx:0,vy:0,sx:e.clientX,sy:e.clientY,moved:0,core:false,ox:0,oy:0};\n  if(S.core&&Math.hypot(p.x-core.x,p.y-core.y)<core.r+16){p.core=true;p.ox=core.x-p.x;p.oy=core.y-p.y}\n  else if(tool==='hole')addHole(p.x,p.y);\n  ptrs.set(e.pointerId,p);hideHint();\n});\n\ncv.addEventListener('pointermove',e=>{\n  const p=ptrs.get(e.pointerId);if(!p)return;\n  const nx=e.clientX,ny=e.clientY;\n  p.vx=nx-p.x;p.vy=ny-p.y;p.x=nx;p.y=ny;\n  p.moved=Math.max(p.moved,Math.hypot(nx-p.sx,ny-p.sy));\n  if(p.core&&p.moved>10){core.x=clamp(nx+p.ox,20,W-20);core.y=clamp(ny+p.oy,20,H-20)}\n});\n\ncv.addEventListener('pointerup',e=>{\n  const p=ptrs.get(e.pointerId);if(!p)return;\n  ptrs.delete(e.pointerId);\n  if(tool==='push'&&!p.core)recoils.push({x:p.x,y:p.y,life:10});\n  if(p.core&&p.moved<=10)coreTap();\n});\n\ncv.addEventListener('pointercancel',e=>ptrs.delete(e.pointerId));\ndocument.addEventListener('gesturestart',e=>e.preventDefault());\n\n/* Simulation */\nfunction step(dt){\n  T+=dt;core.pulse*=Math.pow(.92,dt);\n  syncParticleCount();\n\n  const gk=S.grav*.09;let gx,gy;\n  if(S.tilt){gx=tilt[0]*gk;gy=tilt[1]*gk}\n  else{const i=S.gi,dx=i%3-1,dy=((i/3)|0)-1,m=dx&&dy?.7071:1;gx=dx*m*gk;gy=dy*m*gk}\n\n  pulls.length=0;\n  pushes.length=0; // Absto\u00df-Punkte nur f\u00fcr aktive Ber\u00fchrungen dieses Frames verwenden\n  for(let i=recoils.length-1;i>=0;i--){recoils[i].life-=dt;if(recoils[i].life<=0)recoils.splice(i,1)}\n  for(const p of ptrs.values()){\n    if(!p.core){\n      if(tool==='emit'){\n        for(let j=0;j<3;j++){\n          const idx=Math.floor(Math.random()*n);\n          const a=rnd(0,6.2832),s=rnd(.2,1.5);\n          X[idx]=p.x+rnd(-6,6);Y[idx]=p.y+rnd(-6,6);\n          VX[idx]=p.vx*.2+Math.cos(a)*s;VY[idx]=p.vy*.2+Math.sin(a)*s;\n        }\n      }else if(tool==='pull')pulls.push(p);else if(tool==='push')pushes.push(p);\n    }\n    p.vx*=.8;p.vy*=.8;\n  }\n\n  const flow=S.flow,coreOn=S.core,cf=S.coreF*.5,hf=S.holeF*2400,dr=S.drag*dt,wl=S.walls,tt=T*.012,nh=holes.length,np=pulls.length,nr=pushes.length;\n\n  for(let i=0;i<n;i++){\n    let x=X[i],y=Y[i],vx=VX[i],vy=VY[i];\n    vx+=gx*dt;vy+=gy*dt;\n    if(flow){const a=(Math.sin(x*.004+tt)+Math.cos(y*.0045-tt*.8))*3.1416;vx+=Math.cos(a)*.035*dt;vy+=Math.sin(a)*.035*dt}\n    if(coreOn){\n      const dx=core.x-x,dy=core.y-y,d=Math.sqrt(dx*dx+dy*dy)+1,q=1/(1+d/130);\n      vx+=(dx/d*cf-dy/d*.1)*q*dt;vy+=(dy/d*cf+dx/d*.1)*q*dt;\n    }\n    \n    let dead=false;\n    for(let k=0;k<nh;k++){\n      const h=holes[k],dx=h.x-x,dy=h.y-y,d2=dx*dx+dy*dy;\n      if(d2<81){dead=true;break}\n      const a=hf/(d2+400)/Math.sqrt(d2);vx+=dx*a*dt;vy+=dy*a*dt;\n    }\n    if(dead){respawn(i);continue}\n\n    for(let k=0;k<np;k++){\n      const p=pulls[k],dx=p.x-x,dy=p.y-y,d2=dx*dx+dy*dy;\n      const radius=S.pullR;\n      if(d2<radius*radius){const d=Math.sqrt(d2)+1,a=(1-d/radius)*S.pullF/d;vx+=dx*a*dt;vy+=dy*a*dt}\n    }\n    for(let k=0;k<nr;k++){\n      const p=pushes[k],dx=x-p.x,dy=y-p.y,d2=dx*dx+dy*dy;\n      // Gleiche Grundkraft und Reichweite wie beim Sog, aber nach au\u00dfen gerichtet.\n      // Die Kraft endet am Rand des Wirkungsradius und bleibt nicht gespeichert.\n      const radius=S.pushR;\n      if(d2<radius*radius){\n        const d=Math.sqrt(d2)+1;\n        const a=(1-d/radius)*S.pushF/d;\n        vx+=dx*a*dt;\n        vy+=dy*a*dt;\n      }\n    }\n    // Nach dem Loslassen zieht es f\u00fcr einen kurzen Moment ganz leicht zur\u00fcck.\n    for(let k=0;k<recoils.length;k++){\n      const p=recoils[k],dx=p.x-x,dy=p.y-y,d2=dx*dx+dy*dy,radius=150;\n      if(d2<radius*radius){\n        const d=Math.sqrt(d2)+1;\n        const a=(1-d/radius)*0.075*(p.life/10)/d;\n        vx+=dx*a*dt;\n        vy+=dy*a*dt;\n      }\n    }\n    vx-=vx*dr;vy-=vy*dr;\n    const sp=vx*vx+vy*vy;if(sp>196){const m=14/Math.sqrt(sp);vx*=m;vy*=m}\n    x+=vx*dt;y+=vy*dt;\n\n    if(wl==='bounce'){\n      if(x<0){x=0;vx=Math.abs(vx)*.8}else if(x>W){x=W;vx=-Math.abs(vx)*.8}\n      if(y<0){y=0;vy=Math.abs(vy)*.8}\n      else if(y>H){y=H;vy=-Math.abs(vy)*.8;if(vy>-.35)vy=0;vx*=.985}\n    }else if(wl==='wrap'){\n      if(x<0)x+=W;else if(x>W)x-=W;\n      if(y<0)y+=H;else if(y>H)y-=H;\n    }else if(x<-60||x>W+60||y<-60||y>H+60){\n      respawn(i);continue;\n    }\n    X[i]=x;Y[i]=y;VX[i]=vx;VY[i]=vy;\n  }\n}\n\n/* Zeichnen */\nfunction drawCore(){\n  const cc=CRGB[0],R=core.r*(1+core.pulse*.3),cx=core.x,cy=core.y;\n  ctx.globalCompositeOperation='lighter';\n  let g=ctx.createRadialGradient(cx,cy,R*.3,cx,cy,R*3);\n  g.addColorStop(0,`rgba(${cc.join(',')},.32)`);g.addColorStop(1,`rgba(${cc.join(',')},0)`);\n  ctx.fillStyle=g;ctx.fillRect(cx-R*3,cy-R*3,R*6,R*6);\n  ctx.globalCompositeOperation='source-over';\n  const k=SIDES[shape],N=k||40,rot=T*.004+(shape===3?.785:0);\n  ctx.beginPath();\n  for(let j=0;j<N;j++){\n    const a=rot+j/N*6.2832,r=R*(1+.035*Math.sin(T*.05+j*1.7));\n    j?ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r):ctx.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);\n  }\n  ctx.closePath();\n  g=ctx.createRadialGradient(cx-R*.3,cy-R*.3,R*.1,cx,cy,R*1.1);\n  g.addColorStop(0,rgbStr(mixC(cc,.65)));g.addColorStop(.6,rgbStr(cc));g.addColorStop(1,rgbStr(mixC(cc,-.35)));\n  ctx.fillStyle=g;ctx.fill();\n  ctx.lineWidth=1.5;ctx.strokeStyle='rgba(255,255,255,.55)';ctx.stroke();\n  if(core.pulse>.02){\n    ctx.beginPath();ctx.arc(cx,cy,core.r*(1+(1-core.pulse)*3),0,6.2832);\n    ctx.strokeStyle=`rgba(${mixC(cc,.25).join(',')},${core.pulse*.7})`;ctx.lineWidth=2;ctx.stroke();\n  }\n}\n\nfunction render(){\n  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;\n  ctx.fillStyle=`rgba(${S.oled?'0,0,0':'6,6,12'},${(.6-S.trail*.52).toFixed(3)})`;\n  ctx.fillRect(0,0,W,H);\n  if(S.oled){ctx.globalCompositeOperation='color-burn';ctx.fillStyle='rgb(253,253,253)';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over'}\n\n  cnt.fill(0);\n  for(let i=0;i<n;i++)cnt[HB[i]+1]++;\n  for(let b=0;b<NC;b++)cnt[b+1]+=cnt[b];\n  pos.set(cnt);\n  for(let i=0;i<n;i++)ord[pos[HB[i]]++]=i;\n\n  ctx.globalCompositeOperation='lighter';ctx.lineJoin='round';ctx.lineWidth=S.size*2.4;\n  for(let pass=0;pass<2;pass++)for(let b=0;b<NC;b++){\n    const a=cnt[b],e=cnt[b+1];if(a===e)continue;\n    ctx.beginPath();\n    for(let k=a;k<e;k++){\n      const i=ord[k],x=X[i],y=Y[i],s=SZ[i];\n      switch(SH[i]){\n        case 0:ctx.moveTo(x+s,y);ctx.arc(x,y,s,0,6.2832);break;\n        case 1:ctx.rect(x-s,y-s,s*2,s*2);break;\n        case 2:ctx.moveTo(x,y-s*1.2);ctx.lineTo(x+s*1.1,y+s*.8);ctx.lineTo(x-s*1.1,y+s*.8);ctx.closePath();break;\n        case 3:ctx.moveTo(x,y-s*1.3);ctx.lineTo(x+s,y);ctx.lineTo(x,y+s*1.3);ctx.lineTo(x-s,y);ctx.closePath();break;\n        default:{\n          const vx=VX[i],vy=VY[i],m=Math.hypot(vx,vy)||1,dx=vx/m,dy=vy/m,L=s+Math.min(m,8)*s*.5,w=s*.45;\n          ctx.moveTo(x-L*dx+w*dy,y-L*dy-w*dx);ctx.lineTo(x+L*dx+w*dy,y+L*dy-w*dx);\n          ctx.lineTo(x+L*dx-w*dy,y+L*dy+w*dx);ctx.lineTo(x-L*dx-w*dy,y-L*dy+w*dx);ctx.closePath();\n        }\n      }\n    }\n    const c=COL[b];\n    if(pass===0){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.16;ctx.strokeStyle=c;ctx.stroke()}\n    else{ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.fillStyle=c;ctx.fill()}\n  }\n  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';\n  if(S.core)drawCore();\n  for(let k=0;k<holes.length;k++){\n    const h=holes[k];\n    ctx.beginPath();ctx.arc(h.x,h.y,9,0,6.2832);\n    ctx.fillStyle='#000';ctx.fill();\n    ctx.lineWidth=1;ctx.strokeStyle='rgba(255,255,255,.22)';ctx.stroke();\n  }\n}\n\nlet last=performance.now(),fc=0;\nfunction frame(now){\n  const dt=Math.min(3,(now-last)/16.667);last=now;\n  step(dt);render();\n  if(++fc%12===0)$('#info').textContent=TX('Feste Menge: {0} Partikel \u00b7 {1} L\u00f6cher').replace('{0}',n).replace('{1}',holes.length);\n  requestAnimationFrame(frame);\n}\n\n/* Neigungssensor */\nfunction onOri(e){tilt[0]=Math.sin((e.gamma||0)*Math.PI/180);tilt[1]=Math.sin((e.beta||0)*Math.PI/180)}\nasync function setTilt(on){\n  if(on){\n    try{\n      if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'){\n        if(await DeviceOrientationEvent.requestPermission()!=='granted')on=false;\n      }\n    }catch(e){on=false}\n  }\n  removeEventListener('deviceorientation',onOri);\n  if(on)addEventListener('deviceorientation',onOri);\n  S.tilt=on;\n}\n\n/* Men\u00fc */\nconst rows=$('#rows'),sheet=$('#sheet');\nconst sw=(k,l)=>`<div class=row><span>${l}<\/span><button class=sw data-k=${k}><\/button><\/div>`;\nconst seg=(k,l,o)=>`<div class=row2><span>${l}<\/span><div class=seg data-k=${k}>${o.map(([v,t])=>`<button data-v=${v}>${t}<\/button>`).join('')}<\/div><\/div>`;\nconst SL=[\n  ['max','Partikel-Anzahl (Konstant)',50,3000,50],\n  ['size','Partikelgr\u00f6\u00dfe',1,6,.2],\n  ['trail','Spurl\u00e4nge',0,1,.02],\n  ['grav','Schwerkraft-St\u00e4rke',0,3,.05],\n  ['coreF','Kern-Kraft (minus = absto\u00dfen)',-1,1,.05],\n  ['holeF','Loch-St\u00e4rke',.2,3,.1],\n  ['drag','Luftwiderstand',0,.05,.002],\n  ['pullF','Sog-St\u00e4rke',0,2,.05],\n  ['pullR','Sog-Reichweite',50,450,10],\n  ['pushF','Absto\u00df-St\u00e4rke',0,2,.05],\n  ['pushR','Absto\u00df-Reichweite',50,450,10]\n];\nconst slider=(k)=>{const [key,label,min,max,step]=SL.find(x=>x[0]===k);return `<div class=row3><div class=l><span>${label}<\/span><output><\/output><\/div><input type=range data-k=${key} min=${min} max=${max} step=${step}><\/div>`};\nconst rgbSl=(ch,l)=>`<div class=row3><div class=l><span>${l}<\/span><output><\/output><\/div><input class=rgb type=range data-ch=${ch} min=0 max=255 step=1><\/div>`;\nconst gravityPad=`<div class=row2><span>Schwerkraft-Richtung (\u25cb = aus)<\/span><div class=pad>${[...'\u2196\u2191\u2197\u2190\u25cb\u2192\u2199\u2193\u2198'].map((c,i)=>`<button data-i=${i}>${c}<\/button>`).join('')}<\/div><\/div>`;\nrows.innerHTML=\n  `<details class=\"group\" open><summary>Simulation & Verhalten<\/summary><div class=\"group-body\">`+\n  sw('core','Kern anzeigen')+\n  seg('walls','Bildschirmr\u00e4nder',[['bounce','W\u00e4nde'],['wrap','Durchlauf'],['open','Offen']])+ \n  sw('flow','Str\u00f6mung')+\n  sw('tilt','Neigungssensor (Handy)')+\n  `<\/div><\/details>`+\n  `<details class=\"group\"><summary>Partikel<\/summary><div class=\"group-body\">`+\n  slider('max')+slider('size')+slider('trail')+\n  `<\/div><\/details>`+\n  `<details class=\"group\" open><summary>Kr\u00e4fte & Physik<\/summary><div class=\"group-body\">`+\n  `<details class=\"group\"><summary>Gravitation<\/summary><div class=\"group-body\">`+\n  slider('grav')+gravityPad+\n  `<\/div><\/details>`+\n  `<details class=\"group\"><summary>Sog<\/summary><div class=\"group-body\">`+\n  slider('pullF')+slider('pullR')+\n  `<\/div><\/details>`+\n  `<details class=\"group\"><summary>Absto\u00df<\/summary><div class=\"group-body\">`+\n  slider('pushF')+slider('pushR')+\n  `<div class=row><span>Leichter R\u00fcckzug beim Loslassen<\/span><span style=\"color:var(--dim)\">sehr sanft<\/span><\/div>`+\n  `<\/div><\/details>`+\n  `<details class=\"group\"><summary>Kern & L\u00f6cher<\/summary><div class=\"group-body\">`+\n  slider('coreF')+slider('holeF')+\n  `<\/div><\/details>`+\n  `<details class=\"group\"><summary>Allgemeine Physik<\/summary><div class=\"group-body\">`+\n  slider('drag')+\n  `<\/div><\/details>`+\n  `<\/div><\/details>`+\n  `<details class=\"group\"><summary>Farbe & Gestaltung<\/summary><div class=\"group-body\">`+\n  sw('oled','OLED-Modus (reines Schwarz)')+\n  `<div class=row2><span>Partikelfarben (bis zu 4) \u2013 gleichm\u00e4\u00dfig aufgeteilt<\/span><div class=chips id=chips><\/div>`+\n  `<div class=l style=\"margin:12px 0 0\"><span id=cname><\/span><output id=chex><\/output><\/div><\/div>`+\n  rgbSl(0,'Rot')+rgbSl(1,'Gr\u00fcn')+rgbSl(2,'Blau')+\n  `<div class=row3><button class=act id=cdel data-cdel=1 style=\"width:100%\">Diese Farbe entfernen<\/button><\/div>`+\n  `<div class=row3><div class=l><span>Farbs\u00e4ttigung<\/span><output><\/output><\/div><input type=range data-k=cSat min=0 max=100 step=1><\/div>`+\n  `<div class=row3><div class=l><span>Helligkeit<\/span><output><\/output><\/div><input type=range data-k=cBri min=20 max=100 step=1><\/div>`+\n  `<\/div><\/details>`+\n  `<div class=acts><button class=act data-a=holes>L\u00f6cher entfernen<\/button><button class=act data-a=clear>Mischen<\/button><button class=act data-a=reset>Zur\u00fccksetzen<\/button><\/div>`;\ntrDom(rows);trDom(document.getElementById('bar'));trDom(document.querySelector('#sheet .hd'));trDom(document.getElementById('hint'));trDom(document.getElementById('mixTop'));\n\nconst fmt=v=>Number(v.toFixed(2));\nfunction renderChips(){\n  const k=S.colors.length,sh=Math.round(100/k)+'%';\n  $('#chips').innerHTML=S.colors.map((c,i)=>`<button class=\"chip${i===selC?' on':''}\" data-chip=${i} style=\"background:${rgbStr(c)}\" aria-label=\"${TX('Farbe')} ${i+1}\"><span>${sh}<\/span><\/button>`).join('')\n    +(k<4?`<button class=\"chip add\" data-cadd=1 aria-label=\"${TX('Farbe hinzuf\u00fcgen')}\">\uff0b<\/button>`:'');\n}\nfunction syncColorUI(){\n  const k=S.colors.length;\n  if(selC>=k)selC=k-1;\n  const c=S.colors[selC];\n  renderChips();\n  rows.querySelectorAll('input[data-ch]').forEach(r=>{\n    const ch=+r.dataset.ch,v=c[ch],lo=c.slice(),hi=c.slice();\n    lo[ch]=0;hi[ch]=255;\n    if(+r.value!==v)r.value=v;\n    r.style.setProperty('--from',rgbStr(lo));r.style.setProperty('--to',rgbStr(hi));\n    r.parentElement.querySelector('output').textContent=v;\n  });\n  $('#cname').textContent=TX('Farbe {0} \u00b7 {1} % der Partikel').replace('{0}',selC+1).replace('{1}',Math.round(100/k));\n  $('#chex').textContent=hexStr(c);\n  $('#cdel').style.display=k>1?'':'none';\n}\nlet oledOn=null;\nfunction applyOled(){\n  if(oledOn===!!S.oled)return;\n  oledOn=!!S.oled;\n  document.documentElement.classList.toggle('oled',oledOn);\n  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;\n  ctx.fillStyle=oledOn?'#000':'rgb(6,6,12)';ctx.fillRect(0,0,W,H);\n}\nfunction syncUI(){\n  applyOled();\n  rows.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',!!S[b.dataset.k]));\n  rows.querySelectorAll('.seg').forEach(s=>s.querySelectorAll('button').forEach(b=>b.classList.toggle('on',S[s.dataset.k]===b.dataset.v)));\n  rows.querySelectorAll('.pad button').forEach(b=>b.classList.toggle('on',+b.dataset.i===S.gi));\n  rows.querySelectorAll('input[type=range][data-k]').forEach(r=>{r.value=S[r.dataset.k];r.parentElement.querySelector('output').textContent=fmt(+r.value)});\n  syncColorUI();\n}\n\nrows.addEventListener('click',async e=>{\n  const b=e.target.closest('button');if(!b)return;\n  const par=b.parentElement;\n  if(b.classList.contains('sw')){\n    const k=b.dataset.k;\n    if(k==='tilt')await setTilt(!S.tilt);else S[k]=!S[k];\n  }else if(par.classList.contains('seg')){\n    S[par.dataset.k]=b.dataset.v;\n  }\n  else if(par.classList.contains('pad')){S.gi=+b.dataset.i;if(S.tilt)setTilt(false)}\n  else if(b.dataset.chip!==undefined)selC=+b.dataset.chip;\n  else if(b.dataset.cadd!==undefined){\n    if(S.colors.length<4){S.colors.push(ADD[S.colors.length].slice());selC=S.colors.length-1;updateColors();assignColors()}\n  }\n  else if(b.dataset.cdel!==undefined){\n    if(S.colors.length>1){S.colors.splice(selC,1);selC=Math.min(selC,S.colors.length-1);updateColors();assignColors()}\n  }\n  else if(b.dataset.a==='holes')holes.length=0;\n  else if(b.dataset.a==='clear'){\n    for(let i=0;i<n;i++) respawn(i);\n  }\n  else if(b.dataset.a==='reset'){setTilt(false);Object.assign(S,D);S.colors=D.colors.map(c=>c.slice());selC=0;updateColors();assignColors()}\n  syncUI();save();\n});\n\nrows.addEventListener('input',e=>{\n  const r=e.target;if(r.type!=='range')return;\n  if(r.dataset.ch!==undefined){S.colors[selC][+r.dataset.ch]=+r.value;updateColors();syncColorUI();save();return}\n  S[r.dataset.k]=+r.value;\n  r.parent
