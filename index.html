<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Opferchat</title>
<style>
:root{--a:#8b5cf6;--bg:#f3f3f8;--card:#fff;--tx:#14141c;--mut:#7a7a8c;--line:#e0e0ea;--other:#e9e9f1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b11;--card:#16161f;--tx:#f2f2f8;--mut:#8d8da2;--line:#262633;--other:#1f1f2b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0b11;--card:#16161f;--tx:#f2f2f8;--mut:#8d8da2;--line:#262633;--other:#1f1f2b;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background-image:radial-gradient(circle at 80% -10%,color-mix(in srgb,var(--a),transparent 80%),transparent 50%)}
#app{display:flex;flex-direction:column;height:100%;max-width:720px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;padding:12px 14px 6px}
h1{margin:0;flex:1;font-size:24px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(90deg,var(--a),color-mix(in srgb,var(--a),#ff4d8d 60%));-webkit-background-clip:text;background-clip:text;color:transparent}
button,input,textarea{font:inherit;color:var(--tx)}
.ib{border:1px solid var(--line);background:var(--card);min-width:40px;height:40px;border-radius:12px;font-size:16px;padding:0 10px}
#tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 14px 10px}
.tab{flex:none;border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:99px;font-weight:600}
.tab.on{background:var(--a);color:#fff;border-color:var(--a);box-shadow:0 0 18px color-mix(in srgb,var(--a),transparent 55%)}
.bd{background:#ff3b6b;color:#fff;border-radius:9px;font-size:11px;padding:1px 6px;margin-left:6px}
#list{flex:1;overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;gap:3px}
.m{max-width:84%;align-self:flex-start}
.m.me{align-self:flex-end}
.nm{font-size:12px;font-weight:700;margin:6px 8px 2px;color:var(--a)}
.b{background:var(--other);padding:8px 12px;border-radius:16px 16px 16px 4px;overflow-wrap:anywhere;white-space:pre-wrap}
.me .b{background:linear-gradient(135deg,var(--a),color-mix(in srgb,var(--a),#000 28%));color:#fff;border-radius:16px 16px 4px 16px}
.mt{font-size:10.5px;color:var(--mut);margin:2px 8px;font-variant-numeric:tabular-nums}
.me .mt{text-align:right}
.rd{color:var(--a);font-weight:700}
.q{border-left:3px solid var(--a);background:color-mix(in srgb,currentColor,transparent 88%);padding:3px 8px;margin-bottom:5px;border-radius:6px;font-size:12.5px;white-space:normal}
.rx{display:flex;gap:4px;flex-wrap:wrap;margin:3px 6px 0}
.rx span{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:13px}
.rx span.my{border-color:var(--a)}
.ab{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 6px;margin:4px 0;width:fit-content}
.me .ab{margin-left:auto}
.ab button{border:0;background:none;font-size:20px;padding:2px 5px}
.day{align-self:center;font-size:11px;color:var(--mut);margin:10px 0 4px}
#rp{display:flex;align-items:center;gap:8px;margin:0 12px;padding:6px 10px;border-left:3px solid var(--a);background:var(--card);border-radius:8px;font-size:13px}
#rp div{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#cmp{display:flex;gap:8px;padding:8px 12px 12px;align-items:flex-end}
#in{flex:1;resize:none;max-height:120px;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:10px 14px;outline:0}
#in:focus{border-color:var(--a)}
#go{border:0;background:var(--a);color:#fff;width:44px;height:44px;border-radius:50%;font-size:18px;box-shadow:0 0 16px color-mix(in srgb,var(--a),transparent 55%)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.ov[hidden]{display:none}
.ov.c{align-items:center}
.sc{background:var(--bg);width:100%;max-width:520px;max-height:85%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.c .sc{border-radius:22px;width:calc(100% - 32px)}
.sc h3{margin:0 0 10px}
.sc label{display:block;font-size:12px;color:var(--mut);margin:14px 0 6px}
.sc input[type=text]{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pr{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.pr div{flex:1}.pr small{display:block;color:var(--mut)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mut)}
.dot.on{background:#22c55e;box-shadow:0 0 8px #22c55e}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0}
.big{width:100%;margin-top:12px;border:0;background:var(--a);color:#fff;border-radius:12px;padding:12px;font-weight:700}
.mut{color:var(--mut);font-size:12px}
</style></head>
<body><div id="app">
<header><h1>Opferchat</h1><button class="ib" id="bp">👥</button><button class="ib" id="bs">⚙️</button></header>
<div id="tabs"></div>
<div id="list"><p class="mut" style="text-align:center">Lade …</p></div>
<div id="rp" hidden></div>
<div id="cmp"><textarea id="in" rows="1" placeholder="Nachricht …"></textarea><button id="go">➤</button></div>
</div>
<div class="ov c" id="sh" hidden><div class="sc" id="sc"></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
let off=0,DBU="",fb;const N=()=>Date.now()+off;
const $=s=>document.querySelector(s);
const h=(t,p={},...k)=>{const e=document.createElement(t);for(const x in p){if(x.startsWith('on'))e[x]=p[x];else if(x=='c')e.className=p[x];else e.setAttribute(x,p[x])}e.append(...k.flat().filter(x=>x!=null&&x!==false));return e};
let db,uid,users={},groups=[],msgs=[],rx=[],rd=[],cur,reply,pick,ready=0,marked={},open=null,A='#8b5cf6',gdone=0;
const EM=['👍','❤️','😂','😮','😢','🔥'];
const ST={Schule:'🏫',Zuhause:'🏠',Familie:'👪',Freunde:'🎉',Date:'💘',Schlafen:'😴'};
const PRE=['#8b5cf6','#ec4899','#ef4444','#f59e0b','#22c55e','#06b6d4','#3b82f6'];
const nm=u=>users[u]?.name||'Unbekannt';
const tm=t=>new Date(t).toLocaleTimeString('de-DE',{hour12:false})+'.'+String(new Date(t).getMilliseconds()).padStart(3,'0');
const dy=t=>new Date(t).toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'});
const on=u=>N()-(users[u]?.seen||0)<50000;
const seen=u=>on(u)?'online':!users[u]?.seen?'noch nie online':'zuletzt online '+(dy(users[u].seen)==dy(N())?'':dy(users[u].seen)+', ')+tm(users[u].seen).slice(0,8);
const rt=g=>rd.find(x=>x.gid==g&&x.uid==uid)?.ts||0;
const acc=c=>{A=c;document.documentElement.style.setProperty('--a',c);try{localStorage.setItem('oc_a',c)}catch(e){}};
try{const c=localStorage.getItem('oc_a');if(c)acc(c)}catch(e){}
const upd=async o=>{Object.assign(users[uid],o);render();if(open=='s')sheet('s');try{await db.doc('users/'+uid).update(o)}catch(e){console.error(e)}};

function render(){
  if(!ready)return;
  if(!users[uid]?.name){login();return}
  $('#bp').textContent='👥 '+Object.keys(users).filter(on).length;
  $('#tabs').replaceChildren(...groups.map(g=>{const n=msgs.filter(m=>m.gid==g.id&&m.uid!=uid&&m.ts>rt(g.id)).length;
    return h('button',{c:'tab'+(g.id==cur?' on':''),onclick:()=>{cur=g.id;reply=pick=null;render();mark()}},g.name,n?h('span',{c:'bd'},n):null)}),
    h('button',{c:'tab',onclick:()=>sheet('g')},'＋'));
  const L=$('#list'),near=L.dataset.g!=cur||L.scrollHeight-L.scrollTop-L.clientHeight<120,st=L.scrollTop;
  L.dataset.g=cur;let last='';
  const ms=msgs.filter(m=>m.gid==cur);
  L.replaceChildren(...(ms.length?ms:[null]).flatMap(m=>{
    if(!m)return[h('p',{c:'mut',style:'text-align:center'},'Noch nichts hier. Schreib was!')];
    const mine=m.uid==uid,out=[];
    if(dy(m.ts)!=last){last=dy(m.ts);out.push(h('div',{c:'day'},last))}
    const cnt={};rx.filter(x=>x.mid==m.id).forEach(x=>(cnt[x.e]=cnt[x.e]||[]).push(x.uid));
    const rds=rd.filter(x=>x.gid==m.gid&&x.uid!=m.uid&&x.ts>=m.ts).map(x=>nm(x.uid));
    const q=m.re&&h('div',{c:'q',onclick:e=>{e.stopPropagation();document.getElementById('m'+m.re.id)?.scrollIntoView({block:'center',behavior:'smooth'})}},h('b',{},nm(m.re.u)),h('div',{},m.re.t));
    out.push(h('div',{c:'m'+(mine?' me':''),id:'m'+m.id},
      !mine&&h('div',{c:'nm'},nm(m.uid)),
      h('div',{c:'b',onclick:()=>{pick=pick==m.id?null:m.id;render()}},q,m.t),
      Object.keys(cnt).length?h('div',{c:'rx'},...Object.entries(cnt).map(([e,u])=>h('span',{c:u.includes(uid)?'my':'',onclick:()=>react(m,e)},e+(u.length>1?' '+u.length:'')))):null,
      pick==m.id&&h('div',{c:'ab'},...EM.map(e=>h('button',{onclick:()=>react(m,e)},e)),h('button',{onclick:()=>{reply=m;pick=null;render();$('#in').focus()}},'↩️')),
      h('div',{c:'mt'},tm(m.ts),mine&&h('span',{c:rds.length?'rd':''},' · '+(rds.length?'✓✓ '+rds.slice(0,3).join(', ')+(rds.length>3?' +'+(rds.length-3):''):'✓')))));
    return out}));
  L.scrollTop=near?L.scrollHeight:st;
  const rp=$('#rp');rp.hidden=!reply;
  if(reply)rp.replaceChildren(h('div',{},'↩ '+nm(reply.uid)+': '+reply.t),h('button',{c:'ib',style:'height:28px;min-width:28px',onclick:()=>{reply=null;render()}},'✕'));
  if(open=='p')sheet('p');
}
async function react(m,e){pick=null;render();const c=rx.find(x=>x.mid==m.id&&x.uid==uid),d=db.doc('reactions/'+m.id+'_'+uid);
  try{c&&c.e==e?await d.delete():await d.set({mid:m.id,uid,e})}catch(x){console.error(x)}}
function mark(){
  if(!cur||document.visibilityState!='visible')return;
  const ms=msgs.filter(m=>m.gid==cur),l=ms.length?Math.max(...ms.map(m=>m.ts)):0;
  if(l&&l>(marked[cur]||0)&&l>rt(cur)){marked[cur]=l;db.doc('reads/'+cur+'_'+uid).set({gid:cur,uid,ts:l}).catch(console.error)}
}
async function send(){
  const i=$('#in'),t=i.value.trim();if(!t||!cur)return;
  const r=reply;i.value='';i.style.height='auto';reply=null;render();
  try{await db.collection('messages').add({gid:cur,uid,t,ts:N(),re:r?{id:r.id,u:r.uid,t:r.t.slice(0,80)}:null})}catch(e){console.error(e)}
}
function sheet(k){
  open=k;const s=$('#sh'),c=$('#sc');s.hidden=false;s.classList.toggle('c',k=='g');
  if(k=='p'){
    const us=Object.keys(users).sort((a,b)=>on(b)-on(a)||nm(a).localeCompare(nm(b)));
    c.replaceChildren(h('h3',{},'Leute'),...us.map(u=>h('div',{c:'pr'},h('span',{c:'dot'+(on(u)?' on':'')}),h('div',{},nm(u)+(u==uid?' (du)':''),h('small',{},seen(u))),h('span',{},(ST[users[u].status]||'')+' '+(users[u].status||'')))));
  }else if(k=='s'){
    const me=users[uid];
    c.replaceChildren(h('h3',{},'Einstellungen'),
      h('label',{},'Username'),h('input',{type:'text',maxlength:20,value:me.name,onchange:e=>e.target.value.trim()&&upd({name:e.target.value.trim()})}),
      h('label',{},'Status'),h('div',{c:'chips'},...Object.keys(ST).map(s=>h('button',{c:'tab'+(me.status==s?' on':''),onclick:()=>upd({status:s})},ST[s]+' '+s))),
      h('label',{},'Hauptfarbe'),h('div',{c:'chips'},h('input',{type:'color',value:A,oninput:e=>acc(e.target.value),onchange:e=>upd({accent:e.target.value})}),...PRE.map(c=>h('button',{c:'sw',style:'background:'+c,onclick:()=>{acc(c);upd({accent:c})}}))),
      h('label',{},'Einladungslink für Freunde'),h('input',{type:'text',readonly:'',value:invite(),onclick:e=>e.target.select()}),h('button',{c:'big',onclick:e=>{try{navigator.clipboard.writeText(invite())}catch(x){}e.target.textContent='Kopiert ✓'}},'Link kopieren'),
      h('p',{c:'mut'},'Lesebestätigung und „Zuletzt online“ sind immer aktiv und lassen sich nicht ausschalten.'));
  }else{
    const i=h('input',{type:'text',maxlength:24,placeholder:'Gruppenname'});
    c.replaceChildren(h('h3',{},'Neue Gruppe'),i,h('button',{c:'big',onclick:async()=>{const n=i.value.trim();if(!n)return;closeSh();try{const d=await db.collection('groups').add({name:n,ts:N()});cur=d.id;render()}catch(e){console.error(e)}}},'Erstellen'));
    setTimeout(()=>i.focus(),50);
  }
}
const invite=()=>location.origin+location.pathname+'#db='+encodeURIComponent(DBU);
function setup(){
  open='l';const sh=$('#sh'),c=$('#sc');sh.hidden=false;sh.classList.add('c');
  const i=h('input',{type:'text',placeholder:'https://…firebasedatabase.app'});
  c.replaceChildren(h('h3',{},'Einrichtung'),h('p',{c:'mut'},'Füge die Database-URL aus Firebase ein. Deine Freunde brauchen nur den Einladungslink von dir.'),i,
    h('button',{c:'big',onclick:()=>{const v=i.value.trim().replace(/\/$/,'');if(!/^https:\/\/.+/.test(v))return;try{localStorage.setItem('oc_db',v)}catch(e){}location.hash='db='+encodeURIComponent(v);location.reload()}},'Speichern'));
}
function closeSh(){open=null;$('#sh').hidden=true}
function login(){
  open='l';const s=$('#sh'),c=$('#sc');s.hidden=false;s.classList.add('c');
  if(c.dataset.l)return;c.dataset.l=1;
  const i=h('input',{type:'text',maxlength:20,placeholder:'Dein Username'});
  const go=async()=>{const n=i.value.trim();if(!n)return;
    try{await db.doc('users/'+uid).set({name:n,status:'Zuhause',seen:N(),accent:A});users[uid]={id:uid,name:n,status:'Zuhause',seen:N()};delete c.dataset.l;closeSh();render()}catch(e){console.error(e)}};
  i.onkeydown=e=>e.key=='Enter'&&go();
  c.replaceChildren(h('h3',{},'Willkommen bei Opferchat'),h('p',{c:'mut'},'Such dir einen Username aus. Mehr brauchst du nicht.'),i,h('button',{c:'big',onclick:go},'Los geht’s'));
}
$('#sh').onclick=e=>{if(e.target.id=='sh'&&open!='l')closeSh()};
$('#bp').onclick=()=>sheet('p');$('#bs').onclick=()=>users[uid]&&sheet('s');
$('#go').onclick=send;
$('#in').onkeydown=e=>{if(e.key=='Enter'&&!e.shiftKey){e.preventDefault();send()}};
$('#in').oninput=e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,120)+'px'};

(async()=>{
  try{DBU=new URLSearchParams(location.hash.slice(1)).get('db')||localStorage.getItem('oc_db')||''}catch(e){}
  if(!DBU){setup();return}
  try{localStorage.setItem('oc_db',DBU)}catch(e){}
  try{uid=localStorage.getItem('oc_uid')}catch(e){}
  if(!uid){uid='u'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);try{localStorage.setItem('oc_uid',uid)}catch(e){}}
  firebase.initializeApp({databaseURL:DBU});fb=firebase.database();
  fb.ref('.info/serverTimeOffset').on('value',x=>off=x.val()||0);
  const R=p=>fb.ref(p);
  const dref=p=>({id:p.split('/').pop(),path:p,set:d=>R(p).set(d),update:o=>R(p).update(o),delete:()=>R(p).remove()});
  const col=p=>({doc:id=>dref(p+'/'+id),add:d=>{const k=R(p).push();return k.set(d).then(()=>({id:k.key}))},
    onSnapshot:(fn,er)=>{const r=R(p),f=r.on('value',x=>{const v=x.val()||{};fn({docs:Object.entries(v).map(([id,d])=>({id,data:()=>d}))})},er);return()=>r.off('value',f)}});
  db={doc:dref,collection:col};
  const sub=(c,fn)=>db.collection(c).onSnapshot(s=>{fn(s.docs.map(d=>({id:d.id,...d.data()})));render();mark()},e=>console.error(e));
  sub('users',a=>{
    const first=!ready;users={};a.forEach(u=>users[u.id]=u);ready=1;
    if(first&&users[uid]){if(users[uid].accent)acc(users[uid].accent);beat()}
  });
  sub('groups',a=>{
    groups=a.sort((x,y)=>(x.ts||0)-(y.ts||0));
    if(!gdone){gdone=1;if(!groups.some(g=>g.id=='allgemein'))db.doc('groups/allgemein').set({name:'Allgemein',ts:1}).catch(console.error)}
    if(!cur||!groups.some(g=>g.id==cur))cur=groups[0]?.id;
  });
  sub('messages',a=>msgs=a.sort((x,y)=>x.ts-y.ts));
  sub('reactions',a=>rx=a);
  sub('reads',a=>rd=a);
  setInterval(()=>{beat();render()},20000);
  document.addEventListener('visibilitychange',()=>{beat();mark()});
})();
function beat(){if(db&&users[uid]&&document.visibilityState=='visible'){users[uid].seen=N();db.doc('users/'+uid).update({seen:N()}).catch(()=>{})}}
</script></body></html>
