<style>
/* Konzept: Schulheft. Kariertes Papier, Kuli-Tinte, Textmarker als Akzent, Schriftzug mit Edding. */
:root{
--hl:#ffe14d;--on-hl:#1d2340;
--paper:#f5f6fa;--sheet:#ffffff;--ink:#1d2340;--ink2:#5c6283;--line:#e0e3ee;--grid:rgba(29,35,64,.065);
--blue:#2747d0;--red:#d33a2c;--green:#1f9254;--gold:#c48a00;--teal:#0d8a79;--veil:rgba(20,24,46,.45);
--mk-fg:var(--ink);--mk-bg:var(--hl-swash,var(--hl));
--sel:color-mix(in srgb,var(--hl) 24%,transparent);--promo:color-mix(in srgb,var(--hl) 30%,var(--sheet));--pub-bg:#1d2340;--pub-fg:var(--hl);
--f-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
--f-mark:"Permanent Marker","Marker Felt","Bradley Hand","Segoe Print",cursive;
color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#12152a;--sheet:#1b1f37;--ink:#e8ebf7;--ink2:#9da3c0;--line:#2c3152;--grid:rgba(232,235,247,.045);--blue:#8ea5ff;--red:#ff7062;--green:#4fd18c;--gold:#f0c04a;--teal:#43d1bd;--veil:rgba(0,0,0,.6);--mk-fg:var(--hl-bright,var(--ink));--mk-bg:transparent;--sel:color-mix(in srgb,var(--hl) 12%,transparent);--promo:color-mix(in srgb,var(--hl) 11%,var(--sheet));--pub-bg:var(--hl);--pub-fg:var(--on-hl);color-scheme:dark}}
:root[data-theme="dark"]{--paper:#12152a;--sheet:#1b1f37;--ink:#e8ebf7;--ink2:#9da3c0;--line:#2c3152;--grid:rgba(232,235,247,.045);--blue:#8ea5ff;--red:#ff7062;--green:#4fd18c;--gold:#f0c04a;--teal:#43d1bd;--veil:rgba(0,0,0,.6);--mk-fg:var(--hl-bright,var(--ink));--mk-bg:transparent;--sel:color-mix(in srgb,var(--hl) 12%,transparent);--promo:color-mix(in srgb,var(--hl) 11%,var(--sheet));--pub-bg:var(--hl);--pub-fg:var(--on-hl);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--paper);color:var(--ink);font:15px/1.4 var(--f-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
input,textarea{font-size:16px}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.ic{display:inline-flex;align-items:center;flex:none}
.grid{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px}

#app{position:fixed;left:0;right:0;top:0;height:100%;margin:0 auto;display:flex;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.kb #app{padding-bottom:0}
#app>section{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}

/* Schriftzug */
.mark{font-family:var(--f-mark);font-weight:400;line-height:1.05;color:var(--mk-fg);isolation:isolate;margin:0;letter-spacing:.01em}
.mark span{position:relative;display:inline-block;padding:0 .05em}
.mark span::after{content:"";position:absolute;left:-.1em;right:-.16em;bottom:.05em;height:.46em;background:var(--mk-bg);border-radius:.25em .55em .35em .6em;transform:rotate(-1.6deg);z-index:-1}

/* Kopfzeilen */
.top,.ch{display:flex;align-items:center;gap:4px;background:var(--sheet);border-bottom:1px solid var(--line);padding:8px 8px 8px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));min-height:58px}
.top .mark{flex:1;font-size:26px;min-width:0}
.ch{padding-left:max(6px,env(safe-area-inset-left,0px));gap:8px}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:42px;height:42px;padding:0 9px;border:0;border-radius:12px;background:transparent;color:var(--ink);flex:none}
.ib:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.ib:active{background:color-mix(in srgb,var(--ink) 12%,transparent)}
#onl{font-size:13px;font-weight:650;font-variant-numeric:tabular-nums}

/* Chatliste */
#cl{flex:1;overflow-y:auto;background:var(--sheet);padding-bottom:96px}
.cr{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));cursor:pointer;position:relative}
.cr::after{content:"";position:absolute;left:74px;right:0;bottom:0;border-bottom:1px solid var(--line)}
.cr:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.cr.on{background:var(--sel)}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#1d2340;background:var(--paper)}
.av.g{border-radius:14px}
.av.pub{background:var(--pub-bg);color:var(--pub-fg)}
.av.big{width:72px;height:72px;font-size:28px}
.av.sm{width:40px;height:40px;color:var(--ink);background:var(--paper);border:1px solid var(--line)}
.ch .av{width:38px;height:38px;font-size:15px}
.ch .av .i{width:19px;height:19px}
.ci{flex:1;min-width:0}
.ci>b{display:flex;align-items:center;gap:6px;font-weight:650;font-size:15.5px;min-width:0}
.ci .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinI{color:var(--ink2)}.pinI .i{width:15px;height:15px}
.ci .p{display:flex;align-items:center;gap:4px;color:var(--ink2);font-size:14px;margin-top:2px;min-width:0}
.ci .p>span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .p .i{width:15px;height:15px}
.pf{flex:none;white-space:nowrap}
.cm{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;flex:none}
.cm.u{color:var(--ink);font-weight:650}
.bd{min-width:21px;height:21px;padding:0 6px;border-radius:11px;background:var(--hl);color:var(--on-hl);font-size:12px;font-weight:750;display:inline-flex;align-items:center;justify-content:center}
#fab{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:18px;width:58px;height:58px;border:0;border-radius:18px;background:var(--hl);color:var(--on-hl);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px -8px var(--veil)}
#fab .i{width:25px;height:25px}

/* Chat */
#cav{display:flex}
.ct{flex:1;min-width:0}
.ct b{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:650;white-space:nowrap;overflow:hidden}

.lk>span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk>.ic,.lk>.lg{color:var(--ink2)}
.lk .lg,.lkr .lg{width:22px;height:22px}
.ban2{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;margin:10px 0 2px;font-size:13.5px;line-height:1.4;text-align:left;width:100%}
.ban2.r{background:color-mix(in srgb,var(--red) 13%,transparent)}
.ban2.r>.ic{color:var(--red)}
.ban2.y{background:var(--promo)}
.ban2 .grow>b{display:block}
.sec{font-size:12px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:20px 0 4px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:650;border:1px solid var(--line);border-radius:7px;padding:1px 6px;color:var(--ink2);white-space:nowrap}
.tag .i{width:14px;height:14px}
.pfh{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin:16px 0 6px}
.sc .pfh label{margin:0}
.vis{flex:none;display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line);background:transparent;color:var(--ink2);border-radius:9px;padding:4px 8px;font-size:12px;font-weight:650}
.vis .i{width:15px;height:15px}
.vis.k{color:var(--ink);border-color:var(--ink2)}
.lkr{display:flex;gap:8px;align-items:center;margin-top:8px}
.lkr>.ic{color:var(--ink2)}
.lkr .fld{flex:1;min-width:0;padding:9px 11px}
.avr{display:flex;align-items:center;gap:14px;margin-bottom:4px}
.avr .av{width:72px;height:72px;font-size:28px}
textarea.fld{resize:vertical;min-height:64px;line-height:1.4;display:block}
.sc input[type=date]{width:100%;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:10px 12px;outline:0;min-height:44px}
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.skin{border:2px solid var(--line);border-radius:14px;padding:0;overflow:hidden;background:var(--sheet);color:var(--ink);font-size:12.5px;font-weight:650;text-align:center}
.skin.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.skin>i{display:flex;flex-direction:column;justify-content:center;gap:5px;height:58px;padding:0 10px}
.skin>i b{display:block;height:9px;border-radius:5px;width:62%}
.skin>i b+b{align-self:flex-end;width:46%}
.skin>span{display:block;padding:6px 4px}
.prow{border-bottom:0;padding-top:4px}
.prow b{display:block;font-weight:700}
.supl{display:flex;flex-direction:column;gap:2px;max-height:46vh;overflow-y:auto;padding:4px 0 10px}
.supl .m{max-width:88%}
.supi{display:flex;gap:8px;align-items:flex-end}
.supi textarea{flex:1;min-width:0;min-height:44px}
.cf{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.cf i{position:absolute;top:-14px;width:8px;height:13px;border-radius:2px;animation:cf var(--d) cubic-bezier(.25,.6,.45,1) forwards}
@keyframes cf{to{transform:translate(var(--x),106vh) rotate(var(--r))}}
@media (hover:none){.m .b{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}}
.noshot{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}

const LEGAL={i:"<h2>Impressum</h2><h3>Angaben gemäß § 5 DDG</h3><p>Marlin Fräger<br>Pfarrstraße 100a<br>35102 Lohra</p><h3>Kontakt</h3><p>E-Mail: opferchat@outlook.com<br>Telefon: +49 163 9050185</p><h3>Verantwortlich für den Inhalt nach § 18 Abs. 2 MStV</h3><p>Marlin Fräger, Anschrift wie oben</p><h3>Hinweis zu Inhalten der Nutzer</h3><p>Nachrichten, Bilder, Sprachnachrichten und Profile in Opferchat stammen von den jeweiligen Nutzern. Für diese Inhalte sind die Nutzer selbst verantwortlich. Rechtswidrige Inhalte kannst du in der App melden (Einstellungen, Hilfe und Feedback) oder per E-Mail an die oben genannte Adresse. Wir prüfen Meldungen und entfernen solche Inhalte.</p><h3>Haftung für Links</h3><p>Für Inhalte externer Seiten, auf die Opferchat verlinkt, sind ausschließlich deren Betreiber verantwortlich. Zum Zeitpunkt der Verlinkung waren keine Rechtsverstöße erkennbar.</p>",d:"<h2>Datenschutzerklärung</h2><h3>1. Verantwortlicher</h3><p>Marlin Fräger, Pfarrstraße 100a, 35102 Lohra<br>E-Mail: opferchat@outlook.com, Telefon: +49 163 9050185</p><h3>2. Was wir speichern</h3><p>Beim Registrieren: Benutzername und Passwort (das Passwort speichert Firebase nur verschlüsselt, wir sehen es nie). Bei der Nutzung: deine Nachrichten, Bilder, Sprachnachrichten, Gruppen, Kontakte, Blockierungen, Meldungen, Flammen-Serien, Anmelde-Serie und der Zeitpunkt, wann du zuletzt online warst. Freiwillig: Profilbild, Beschreibung, Alter oder Geburtstag, Geschlecht, Wohnort, Beziehungsstatus, Vor- und Nachname und Links zu deinen Social-Media-Konten, Telefonnummer und E-Mail. Bei jedem dieser Profilfelder legst du fest, ob es Alle oder nur deine Kontakte sehen. Deinen vollständigen Geburtstag sehen andere nie, nur Tag und Monat oder dein Alter.</p><h3>3. Wozu und auf welcher Grundlage</h3><p>Wir brauchen die Daten, damit der Chat funktioniert (Art. 6 Abs. 1 lit. b DSGVO). Freiwillige Profilangaben speichern wir, weil du sie selbst eingibst (Einwilligung, Art. 6 Abs. 1 lit. a DSGVO). Du kannst sie jederzeit ändern oder löschen. Für Sicherheit und Missbrauchsschutz, zum Beispiel Sperren und Meldungen, nutzen wir unser berechtigtes Interesse (Art. 6 Abs. 1 lit. f DSGVO).</p><h3>4. Wer die Daten verarbeitet</h3><p>Firebase (Google Ireland Limited, Gordon House, Barrow Street, Dublin 4, Irland, und Google LLC, USA) speichert Konten und Chat-Daten. Netlify, Inc. (USA) hostet die Webseite, und die Domain läuft über Strato. Dabei können Daten in Länder außerhalb der EU übertragen werden. Google und Netlify stützen sich dafür auf die EU-Standardvertragsklauseln beziehungsweise das EU-US Data Privacy Framework. Beim Aufruf der Seite werden zudem die Schriftart von Google Fonts geladen. Dabei erhält Google deine IP-Adresse.</p><h3>5. Wer deine Inhalte sieht</h3><p>Nachrichten sehen die Mitglieder des jeweiligen Chats. Im Public Chat sehen sie alle angemeldeten Nutzer. Der Owner kann Meldungen und Ideen lesen, die du über Hilfe und Feedback schickst. Wir verkaufen keine Daten und geben sie nicht an Dritte weiter, außer wir sind gesetzlich dazu verpflichtet.</p><h3>6. Speicher auf deinem Gerät</h3><p>Die App speichert Einstellungen wie Design und Filter in deinem Browser (localStorage). Das ist für den Betrieb nötig. Wir nutzen keine Tracking- oder Analyse-Dienste.</p><h3>7. Speicherdauer und Löschung</h3><p>Wir speichern deine Daten, solange dein Konto besteht. Du kannst dein Konto in den Einstellungen unter „Konto löschen“ selbst löschen. Dabei werden auch deine Nachrichten, Privatchats und dein Profil gelöscht. Meldungen und Ideen, die du an den Owner geschickt hast, löschen wir auf Anfrage per E-Mail an die oben genannte Adresse. Einmalbilder werden nach dem Ansehen gelöscht. Nachrichten kannst du selbst löschen.</p><h3>8. Deine Rechte</h3><p>Du hast das Recht auf Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung, Datenübertragbarkeit und Widerspruch. Eine erteilte Einwilligung kannst du jederzeit widerrufen. Schreib dafür an die E-Mail-Adresse oben. Du kannst dich außerdem bei einer Datenschutzbehörde beschweren, zum Beispiel beim Hessischen Beauftragten für Datenschutz und Informationsfreiheit, Postfach 3163, 65021 Wiesbaden.</p><h3>9. Alter</h3><p>Wenn du unter 16 bist, nutze Opferchat bitte nur mit Erlaubnis deiner Eltern.</p><h3>10. Werbung</h3><p>Aktuell gibt es keine Werbung. Wenn Werbung eingebunden wird, ergänzen wir diese Erklärung vorher.</p><p><small>Stand: November 2026</small></p>"};

)}\ninput.rgb::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid #1a1a2e;box-shadow:0 0 0 1px rgba(255,255,255,.6)}\n/* OLED-Modus */\nhtml.oled{--bg:#000;--panel:rgba(0,0,0,.88);--solid:#000;--line:rgba(255,255,255,.12)}\nhtml.oled #sheet{background:rgba(0,0,0,.94)}\nhtml.oled .seg,html.oled .pad button,html.oled .act,html.oled #x{background:#0b0b10}\n<\/style>\n<\/head>\n<body>\n<canvas id=\"c\"><\/canvas>\n<div id=\"info\"><\/div>\n<button id=\"mixTop\" type=\"button\">\u2928 Mischen<\/button>\n<div id=\"hint\">Tippe auf den Kern<\/div>\n<div id=\"bar\">\n  <button class=\"b on\" data-t=\"emit\"><i>\u2726<\/i>Partikel<\/button>\n  <button class=\"b\" data-t=\"hole\"><i>\u25cf<\/i>Loch<\/button>\n  <button class=\"b\" data-t=\"pull\"><i>\u25ce<\/i>Sog<\/button>\n  <button class=\"b\" data-t=\"push\"><i>\u2197<\/i>Absto\u00df<\/button>\n  <button class=\"b\" id=\"gear\"><i>\u2699<\/i>Optionen<\/button>\n<\/div>\n<div id=\"sheet\">\n  <div class=\"hd\"><b>Optionen & Farbe<\/b><button id=\"x\" aria-label=\"Schlie\u00dfen\">\u2715<\/button><\/div>\n  <div id=\"rows\"><\/div>\n<\/div>\n<script>\n(()=>{\nconst $=s=>document.querySelector(s);\nconst cv=$('#c'),ctx=cv.getContext('2d');\n\nconst D={\n  core:false,\n  walls:'bounce',\n  oled:false,\n  colors:[[142,61,255]],\n  cSat:100,\n  cBri:100,\n  flow:true,\n  tilt:false,\n  max:800,\n  size:2.4,\n  trail:.6,\n  grav:.35,\n  gi:7,\n  coreF:.3,\n  holeF:1,\n  drag:.01,\n  pullF:.9,\n  pullR:250,\n  pushF:.9,\n  pushR:250\n};\n\nconst S=Object.assign({},D);\ntry{Object.assign(S,JSON.parse(localStorage.getItem('pk')||'{}'))}catch(e){}\nS.tilt=false;\n['baseHue','cmode','palette','sat','val'].forEach(k=>delete S[k]);\nS.colors=(Array.isArray(S.colors)&&S.colors.length>=1&&S.colors.length<=4&&S.colors.every(c=>Array.isArray(c)&&c.length===3&&c.every(v=>Number.isFinite(+v))))\n  ?S.colors.map(c=>c.map(v=>Math.max(0,Math.min(255,Math.round(+v)))))\n  :D.colors.map(c=>c.slice());\nconst save=()=>{try{localStorage.setItem('pk',JSON.stringify(S))}catch(e){}};\n\nlet W=0,H=0,dpr=1;\nconst CAP=4000;\nconst X=new Float32Array(CAP),Y=new Float32Array(CAP),VX=new Float32Array(CAP),VY=new Float32Array(CAP),\n      SZ=new Float32Array(CAP),HB=new Uint8Array(CAP),SH=new Uint8Array(CAP);\nconst NC=4,cnt=new Int32Array(NC+1),pos=new Int32Array(NC+1),ord=new Int32Array(CAP);\nlet n=0,shape=0,tool='emit',T=0,selC=0;\nconst core={x:0,y:0,r:34,pulse:0};\nconst holes=[],ptrs=new Map(),pulls=[],pushes=[],recoils=[],tilt=[0,0];\nconst SIDES=[0,4,3,4,6];\nconst COL=[],CRGB=[],ADD=[null,[25,224,255],[255,70,160],[255,190,40]];\nconst rgbStr=c=>`rgb(${c[0]},${c[1]},${c[2]})`;\nconst hexStr=c=>'#'+c.map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase();\nconst mixC=(c,t)=>{const k=t<0?0:255,a=Math.abs(t);return c.map(v=>Math.round(v+(k-v)*a))};\n\n/* Gew\u00e4hlte RGB-Farbe; S\u00e4ttigung/Helligkeit = 100 % lassen sie exakt unver\u00e4ndert */\nfunction effRGB(c){\n  const s=S.cSat/100,br=S.cBri/100,g=.299*c[0]+.587*c[1]+.114*c[2];\n  return c.map(v=>Math.max(0,Math.min(255,Math.round((g+(v-g)*s)*br))));\n}\nfunction updateColors(){\n  COL.length=0;CRGB.length=0;\n  for(const c of S.colors){const e=effRGB(c);CRGB.push(e);COL.push(rgbStr(e))}\n}\nupdateColors();\n\nconst rnd=(a,b)=>a+Math.random()*(b-a);\nconst clamp=(v,a,b)=>Math.min(b,Math.max(a,v));\n\nfunction resize(){\n  dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;\n  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);\n  if(!core.x){core.x=W/2;core.y=H*.42}\n  core.x=clamp(core.x,20,W-20);core.y=clamp(core.y,20,H-20);\n}\naddEventListener('resize',resize);resize();\n\n/* Jedes Partikel beh\u00e4lt seinen Farbplatz (Index % Farbanzahl) -> Anteile exakt 100 / 50 / 33 / 25 % */\nconst pickCol=i=>i%S.colors.length;\nfunction assignColors(){for(let i=0;i<n;i++)HB[i]=pickCol(i)}\n\nfunction spawnOne(x,y,vx,vy){\n  if(n>=CAP)return;\n  const i=n++;\n  X[i]=x!==undefined?x:(S.core?core.x+rnd(-20,20):rnd(0,W));\n  Y[i]=y!==undefined?y:(S.core?core.y+rnd(-20,20):rnd(0,H));\n  VX[i]=vx!==undefined?vx:rnd(-1,1);\n  VY[i]=vy!==undefined?vy:rnd(-1,1);\n  SZ[i]=S.size*rnd(.6,1.3);\n  HB[i]=pickCol(i);\n  SH[i]=Math.random()<.8?shape:(shape+1)%5;\n}\n\nfunction syncParticleCount(){\n  const target=Math.min(CAP,S.max);\n  while(n<target) spawnOne();\n  while(n>target) n--;\n}\n\nfunction respawn(i){\n  if(S.core){\n    const a=rnd(0,6.2832),s=rnd(.5,2);\n    X[i]=core.x+Math.cos(a)*core.r*.8;\n    Y[i]=core.y+Math.sin(a)*core.r*.8;\n    VX[i]=Math.cos(a)*s;VY[i]=Math.sin(a)*s;\n  }else{\n    X[i]=rnd(0,W);Y[i]=rnd(0,H);\n    VX[i]=rnd(-.8,.8);VY[i]=rnd(-.8,.8);\n  }\n  SZ[i]=S.size*rnd(.6,1.3);\n  HB[i]=pickCol(i);\n  SH[i]=Math.random()<.8?shape:(shape+1)%5;\n}\n\nfunction burst(x,y,k,sp){\n  for(let j=0;j<k;j++){\n    const idx=Math.floor(Math.random()*n);\n    if(idx<n){\n      const a=rnd(0,6.2832),s=rnd(.5,1)*sp;\n      X[idx]=x+Math.cos(a)*core.r*.8;\n      Y[idx]=y+Math.sin(a)*core.r*.8;\n      VX[idx]=Math.cos(a)*s;VY[idx]=Math.sin(a)*s;\n    }\n  }\n}\n\nfunction coreTap(){\n  shape=(shape+1)%5;\n  core.pulse=1;\n  burst(core.x,core.y,80,6);\n  syncUI();\n  if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}\n}\n\nfunction addHole(x,y){\n  for(let k=0;k<holes.length;k++){if(Math.hypot(holes[k].x-x,holes[k].y-y)<22){holes.splice(k,1);return}}\n  holes.push({x,y});\n  if(holes.length>10)holes.shift();\n}\n\nconst hint=$('#hint');\nconst hideHint=()=>{hint.style.opacity=0;hint.style.animation='none'};\nsetTimeout(hideHint,9000);\n\n/* Eingabe */\ncv.addEventListener('pointerdown',e=>{\n  try{cv.setPointerCapture(e.pointerId)}catch(_){}\n  const p={x:e.clientX,y:e.clientY,vx:0,vy:0,sx:e.clientX,sy:e.clientY,moved:0,core:false,ox:0,oy:0};\n  if(S.core&&Math.hypot(p.x-core.x,p.y-core.y)<core.r+16){p.core=true;p.ox=core.x-p.x;p.oy=core.y-p.y}\n  else if(tool==='hole')addHole(p.x,p.y);\n  ptrs.set(e.pointerId,p);hideHint();\n});\n\ncv.addEventListener('pointermove',e=>{\n  const p=ptrs.get(e.pointerId);if(!p)return;\n  const nx=e.clientX,ny=e.clientY;\n  p.vx=nx-p.x;p.vy=ny-p.y;p.x=nx;p.y=ny;\n  p.moved=Math.max(p.moved,Math.hypot(nx-p.sx,ny-p.sy));\n  if(p.core&&p.moved>10){core.x=clamp(nx+p.ox,20,W-20);core.y=clamp(ny+p.oy,20,H-20)}\n});\n\ncv.addEventListener('pointerup',e=>{\n  const p=ptrs.get(e.pointerId);if(!p)return;\n  ptrs.delete(e.pointerId);\n  if(tool==='push'&&!p.core)recoils.push({x:p.x,y:p.y,life:10});\n  if(p.core&&p.moved<=10)coreTap();\n});\n\ncv.addEventListener('pointercancel',e=>ptrs.delete(e.pointerId));\ndocument.addEventListener('gesturestart',e=>e.preventDefault());\n\n/* Simulation */\nfunction step(dt){\n  T+=dt;core.pulse*=Math.pow(.92,dt);\n  syncParticleCount();\n\n  const gk=S.grav*.09;let gx,gy;\n  if(S.tilt){gx=tilt[0]*gk;gy=tilt[1]*gk}\n  else{const i=S.gi,dx=i%3-1,dy=((i/3)|0)-1,m=dx&&dy?.7071:1;gx=dx*m*gk;gy=dy*m*gk}\n\n  pulls.length=0;\n  pushes.length=0; // Absto\u00df-Punkte nur f\u00fcr aktive Ber\u00fchrungen dieses Frames verwenden\n  for(let i=recoils.length-1;i>=0;i--){recoils[i].life-=dt;if(recoils[i].life<=0)recoils.splice(i,1)}\n  for(const p of ptrs.values()){\n    if(!p.core){\n      if(tool==='emit'){\n        for(let j=0;j<3;j++){\n          const idx=Math.floor(Math.random()*n);\n          const a=rnd(0,6.2832),s=rnd(.2,1.5);\n          X[idx]=p.x+rnd(-6,6);Y[idx]=p.y+rnd(-6,6);\n          VX[idx]=p.vx*.2+Math.cos(a)*s;VY[idx]=p.vy*.2+Math.sin(a)*s;\n        }\n      }else if(tool==='pull')pulls.push(p);else if(tool==='push')pushes.push(p);\n    }\n    p.vx*=.8;p.vy*=.8;\n  }\n\n  const flow=S.flow,coreOn=S.core,cf=S.coreF*.5,hf=S.holeF*2400,dr=S.drag*dt,wl=S.walls,tt=T*.012,nh=holes.length,np=pulls.length,nr=pushes.length;\n\n  for(let i=0;i<n;i++){\n    let x=X[i],y=Y[i],vx=VX[i],vy=VY[i];\n    vx+=gx*dt;vy+=gy*dt;\n    if(flow){const a=(Math.sin(x*.004+tt)+Math.cos(y*.0045-tt*.8))*3.1416;vx+=Math.cos(a)*.035*dt;vy+=Math.sin(a)*.035*dt}\n    if(coreOn){\n      const dx=core.x-x,dy=core.y-y,d=Math.sqrt(dx*dx+dy*dy)+1,q=1/(1+d/130);\n      vx+=(dx/d*cf-dy/d*.1)*q*dt;vy+=(dy/d*cf+dx/d*.1)*q*dt;\n    }\n    \n    let dead=false;\n    for(let k=0;k<nh;k++){\n      const h=holes[k],dx=h.x-x,dy=h.y-y,d2=dx*dx+dy*dy;\n      if(d2<81){dead=true;break}\n      const a=hf/(d2+400)/Math.sqrt(d2);vx+=dx*a*dt;vy+=dy*a*dt;\n    }\n    if(dead){respawn(i);continue}\n\n    for(let k=0;k<np;k++){\n      const p=pulls[k],dx=p.x-x,dy=p.y-y,d2=dx*dx+dy*dy;\n      const radius=S.pullR;\n      if(d2<radius*radius){const d=Math.sqrt(d2)+1,a=(1-d/radius)*S.pullF/d;vx+=dx*a*dt;vy+=dy*a*dt}\n    }\n    for(let k=0;k<nr;k++){\n      const p=pushes[k],dx=x-p.x,dy=y-p.y,d2=dx*dx+dy*dy;\n      // Gleiche Grundkraft und Reichweite wie beim Sog, aber nach au\u00dfen gerichtet.\n      // Die Kraft endet am Rand des Wirkungsradius und bleibt nicht gespeichert.\n      const radius=S.pushR;\n      if(d2<radius*radius){\n        const d=Math.sqrt(d2)+1;\n        const a=(1-d/radius)*S.pushF/d;\n        vx+=dx*a*dt;\n        vy+=dy*a*dt;\n      }\n    }\n    // Nach dem Loslassen zieht es f\u00fcr einen kurzen Moment ganz leicht zur\u00fcck.\n    for(let k=0;k<recoils.length;k++){\n      const p=recoils[k],dx=p.x-x,dy=p.y-y,d2=dx*dx+dy*dy,radius=150;\n      if(d2<radius*radius){\n        const d=Math.sqrt(d2)+1;\n        const a=(1-d/radius)*0.075*(p.life/10)/d;\n        vx+=dx*a*dt;\n        vy+=dy*a*dt;\n      }\n    }\n    vx-=vx*dr;vy-=vy*dr;\n    const sp=vx*vx+vy*vy;if(sp>196){const m=14/Math.sqrt(sp);vx*=m;vy*=m}\n    x+=vx*dt;y+=vy*dt;\n\n    if(wl==='bounce'){\n      if(x<0){x=0;vx=Math.abs(vx)*.8}else if(x>W){x=W;vx=-Math.abs(vx)*.8}\n      if(y<0){y=0;vy=Math.abs(vy)*.8}\n      else if(y>H){y=H;vy=-Math.abs(vy)*.8;if(vy>-.35)vy=0;vx*=.985}\n    }else if(wl==='wrap'){\n      if(x<0)x+=W;else if(x>W)x-=W;\n      if(y<0)y+=H;else if(y>H)y-=H;\n    }else if(x<-60||x>W+60||y<-60||y>H+60){\n      respawn(i);continue;\n    }\n    X[i]=x;Y[i]=y;VX[i]=vx;VY[i]=vy;\n  }\n}\n\n/* Zeichnen */\nfunction drawCore(){\n  const cc=CRGB[0],R=core.r*(1+core.pulse*.3),cx=core.x,cy=core.y;\n  ctx.globalCompositeOperation='lighter';\n  let g=ctx.createRadialGradient(cx,cy,R*.3,cx,cy,R*3);\n  g.addColorStop(0,`rgba(${cc.join(',')},.32)`);g.addColorStop(1,`rgba(${cc.join(',')},0)`);\n  ctx.fillStyle=g;ctx.fillRect(cx-R*3,cy-R*3,R*6,R*6);\n  ctx.globalCompositeOperation='source-over';\n  const k=SIDES[shape],N=k||40,rot=T*.004+(shape===3?.785:0);\n  ctx.beginPath();\n  for(let j=0;j<N;j++){\n    const a=rot+j/N*6.2832,r=R*(1+.035*Math.sin(T*.05+j*1.7));\n    j?ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r):ctx.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);\n  }\n  ctx.closePath();\n  g=ctx.createRadialGradient(cx-R*.3,cy-R*.3,R*.1,cx,cy,R*1.1);\n  g.addColorStop(0,rgbStr(mixC(cc,.65)));g.addColorStop(.6,rgbStr(cc));g.addColorStop(1,rgbStr(mixC(cc,-.35)));\n  ctx.fillStyle=g;ctx.fill();\n  ctx.lineWidth=1.5;ctx.strokeStyle='rgba(255,255,255,.55)';ctx.stroke();\n  if(core.pulse>.02){\n    ctx.beginPath();ctx.arc(cx,cy,core.r*(1+(1-core.pulse)*3),0,6.2832);\n    ctx.strokeStyle=`rgba(${mixC(cc,.25).join(',')},${core.pulse*.7})`;ctx.lineWidth=2;ctx.stroke();\n  }\n}\n\nfunction render(){\n  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;\n  ctx.fillStyle=`rgba(${S.oled?'0,0,0':'6,6,12'},${(.6-S.trail*.52).toFixed(3)})`;\n  ctx.fillRect(0,0,W,H);\n  if(S.oled){ctx.globalCompositeOperation='color-burn';ctx.fillStyle='rgb(253,253,253)';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over'}\n\n  cnt.fill(0);\n  for(let i=0;i<n;i++)cnt[HB[i]+1]++;\n  for(let b=0;b<NC;b++)cnt[b+1]+=cnt[b];\n  pos.set(cnt);\n  for(let i=0;i<n;i++)ord[pos[HB[i]]++]=i;\n\n  ctx.globalCompositeOperation='lighter';ctx.lineJoin='round';ctx.lineWidth=S.size*2.4;\n  for(let pass=0;pass<2;pass++)for(let b=0;b<NC;b++){\n    const a=cnt[b],e=cnt[b+1];if(a===e)continue;\n    ctx.beginPath();\n    for(let k=a;k<e;k++){\n      const i=ord[k],x=X[i],y=Y[i],s=SZ[i];\n      switch(SH[i]){\n        case 0:ctx.moveTo(x+s,y);ctx.arc(x,y,s,0,6.2832);break;\n        case 1:ctx.rect(x-s,y-s,s*2,s*2);break;\n        case 2:ctx.moveTo(x,y-s*1.2);ctx.lineTo(x+s*1.1,y+s*.8);ctx.lineTo(x-s*1.1,y+s*.8);ctx.closePath();break;\n        case 3:ctx.moveTo(x,y-s*1.3);ctx.lineTo(x+s,y);ctx.lineTo(x,y+s*1.3);ctx.lineTo(x-s,y);ctx.closePath();break;\n        default:{\n          const vx=VX[i],vy=VY[i],m=Math.hypot(vx,vy)||1,dx=vx/m,dy=vy/m,L=s+Math.min(m,8)*s*.5,w=s*.45;\n          ctx.moveTo(x-L*dx+w*dy,y-L*dy-w*dx);ctx.lineTo(x+L*dx+w*dy,y+L*dy-w*dx);\n          ctx.lineTo(x+L*dx-w*dy,y+L*dy+w*dx);ctx.lineTo(x-L*dx-w*dy,y-L*dy+w*dx);ctx.closePath();\n        }\n      }\n    }\n    const c=COL[b];\n    if(pass===0){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.16;ctx.strokeStyle=c;ctx.stroke()}\n    else{ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.fillStyle=c;ctx.fill()}\n  }\n  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';\n  if(S.core)drawCore();\n  for(let k=0;k<holes.length;k++){\n    const h=holes[k];\n    ctx.beginPath();ctx.arc(h.x,h.y,9,0,6.2832);\n    ctx.fillStyle='#000';ctx.fill();\n    ctx.lineWidth=1;ctx.strokeStyle='rgba(255,255,255,.22)';ctx.stroke();\n  }\n}\n\nlet last=performance.now(),fc=0;\nfunction frame(now){\n  const dt=Math.min(3,(now-last)/16.667);last=now;\n  step(dt);render();\n  if(++fc%12===0)$('#info').textContent=`Feste Menge: ${n} Partikel \u00b7 ${holes.length} L\u00f6cher`;\n  requestAnimationFrame(frame);\n}\n\n/* Neigungssensor */\nfunction onOri(e){tilt[0]=Math.sin((e.gamma||0)*Math.PI/180);tilt[1]=Math.sin((e.beta||0)*Math.PI/180)}\nasync function setTilt(on){\n  if(on){\n    try{\n      if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'){\n        if(await DeviceOrientationEvent.requestPermission()!=='granted')on=false;\n      }\n    }catch(e){on=false}\n  }\n  removeEventListener('deviceorientation',onOri);\n  if(on)addEventListener('deviceorientation',onOri);\n  S.tilt=on;\n}\n\n/* Men\u00fc */\nconst rows=$('#rows'),sheet=$('#sheet');\nconst sw=(k,l)=>`<div class=row><span>${l}<\/span><button class=sw data-k=${k}><\/button><\/div>`;\nconst seg=(k,l,o)=>`<div class=row2><span>${l}<\/span><div class=seg data-k=${k}>${o.map(([v,t])=>`<button data-v=${v}>${t}<\/button>`).join('')}<\/div><\/div>`;\nconst SL=[\n  ['max','Partikel-Anzahl (Konstant)',50,3000,50],\n  ['size','Partikelgr\u00f6\u00dfe',1,6,.2],\n  ['trail','Spurl\u00e4nge',0,1,.02],\n  ['grav','Schwerkraft-St\u00e4rke',0,3,.05],\n  ['coreF','Kern-Kraft (minus = absto\u00dfen)',-1,1,.05],\n  ['holeF','Loch-St\u00e4rke',.2,3,.1],\n  ['drag','Luftwiderstand',0,.05,.002],\n  ['pullF','Sog-St\u00e4rke',0,2,.05],\n  ['pullR','Sog-Reichweite',50,450,10],\n  ['pushF','Absto\u00df-St\u00e4rke',0,2,.05],\n  ['pushR','Absto\u00df-Reichweite',50,450,10]\n];\nconst slider=(k)=>{const [key,label,min,max,step]=SL.find(x=>x[0]===k);return `<div class=row3><div class=l><span>${label}<\/span><output><\/output><\/div><input type=range data-k=${key} min=${min} max=${max} step=${step}><\/div>`};\nconst rgbSl=(ch,l)=>`<div class=row3><div class=l><span>${l}<\/span><output><\/output><\/div><input class=rgb type=range data-ch=${ch} min=0 max=255 step=1><\/div>`;\nconst gravityPad=`<div class=row2><span>Schwerkraft-Richtung (\u25cb = aus)<\/span><div class=pad>${[...'\u2196\u2191\u2197\u2190\u25cb\u2192\u2199\u2193\u2198'].map((c,i)=>`<button data-i=${i}>${c}<\/button>`).join('')}<\/div><\/div>`;\nrows.innerHTML=\n  `<details class=\"group\" open><summary>Simulation & Verhalten<\/summary><div class=\"group-body\">`+\n  sw('core','Kern anzeigen')+\n  seg('walls','Bildschirmr\u00e4nder',[['bounce','W\u00e4nde'],['wrap','Durchlauf'],['open','Offen']])+ \n  sw('flow','Str\u00f6mung')+\n  sw('tilt','Neigungssensor (Handy)')+\n  `<\/div><\/details>`+\n  `<details class=\"group\"><summary>Partikel<\/summary><div class=\"group-body\">`+\n  slider('max')+slider('size')+slider('trail')+\n  `<\/div><\/details>`+\n  `<details class=\"group\" open><summary>Kr\u00e4fte & Physik<\/summary><div class=\"group-body\">`+\n  `<details class=\"group\"><summary>Gravitation<\/summary><div class=\"group-body\">`+\n  slider('grav')+gravityPad+\n  `<\/div><\/details>`+\n  `<details class=\"group\"><summary>Sog<\/summary><div class=\"group-body\">`+\n  slider('pullF')+slider('pullR')+\n  `<\/div><\/details>`+\n  `<details class=\"group\"><summary>Absto\u00df<\/summary><div class=\"group-body\">`+\n  slider('pushF')+slider('pushR')+\n  `<div class=row><span>Leichter R\u00fcckzug beim Loslassen<\/span><span style=\"color:var(--dim)\">sehr sanft<\/span><\/div>`+\n  `<\/div><\/details>`+\n  `<details class=\"group\"><summary>Kern & L\u00f6cher<\/summary><div class=\"group-body\">`+\n  slider('coreF')+slider('holeF')+\n  `<\/div><\/details>`+\n  `<details class=\"group\"><summary>Allgemeine Physik<\/summary><div class=\"group-body\">`+\n  slider('drag')+\n  `<\/div><\/details>`+\n  `<\/div><\/details>`+\n  `<details class=\"group\"><summary>Farbe & Gestaltung<\/summary><div class=\"group-body\">`+\n  sw('oled','OLED-Modus (reines Schwarz)')+\n  `<div class=row2><span>Partikelfarben (bis zu 4) \u2013 gleichm\u00e4\u00dfig aufgeteilt<\/span><div class=chips id=chips><\/div>`+\n  `<div class=l style=\"margin:12px 0 0\"><span id=cname><\/span><output id=chex><\/output><\/div><\/div>`+\n  rgbSl(0,'Rot')+rgbSl(1,'Gr\u00fcn')+rgbSl(2,'Blau')+\n  `<div class=row3><button class=act id=cdel data-cdel=1 style=\"width:100%\">Diese Farbe entfernen<\/button><\/div>`+\n  `<div class=row3><div class=l><span>Farbs\u00e4ttigung<\/span><output><\/output><\/div><input type=range data-k=cSat min=0 max=100 step=1><\/div>`+\n  `<div class=row3><div class=l><span>Helligkeit<\/span><output><\/output><\/div><input type=range data-k=cBri min=20 max=100 step=1><\/div>`+\n  `<\/div><\/details>`+\n  `<div class=acts><button class=act data-a=holes>L\u00f6cher entfernen<\/button><button class=act data-a=clear>Mischen<\/button><button class=act data-a=reset>Zur\u00fccksetzen<\/button><\/div>`;\n\nconst fmt=v=>Number(v.toFixed(2));\nfunction renderChips(){\n  const k=S.colors.length,sh=Math.round(100/k)+'%';\n  $('#chips').innerHTML=S.colors.map((c,i)=>`<button class=\"chip${i===selC?' on':''}\" data-chip=${i} style=\"background:${rgbStr(c)}\" aria-label=\"Farbe ${i+1}\"><span>${sh}<\/span><\/button>`).join('')\n    +(k<4?`<button class=\"chip add\" data-cadd=1 aria-label=\"Farbe hinzuf\u00fcgen\">\uff0b<\/button>`:'');\n}\nfunction syncColorUI(){\n  const k=S.colors.length;\n  if(selC>=k)selC=k-1;\n  const c=S.colors[selC];\n  renderChips();\n  rows.querySelectorAll('input[data-ch]').forEach(r=>{\n    const ch=+r.dataset.ch,v=c[ch],lo=c.slice(),hi=c.slice();\n    lo[ch]=0;hi[ch]=255;\n    if(+r.value!==v)r.value=v;\n    r.style.setProperty('--from',rgbStr(lo));r.style.setProperty('--to',rgbStr(hi));\n    r.parentElement.querySelector('output').textContent=v;\n  });\n  $('#cname').textContent=`Farbe ${selC+1} \u00b7 ${Math.round(100/k)} % der Partikel`;\n  $('#chex').textContent=hexStr(c);\n  $('#cdel').style.display=k>1?'':'none';\n}\nlet oledOn=null;\nfunction applyOled(){\n  if(oledOn===!!S.oled)return;\n  oledOn=!!S.oled;\n  document.documentElement.classList.toggle('oled',oledOn);\n  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;\n  ctx.fillStyle=oledOn?'#000':'rgb(6,6,12)';ctx.fillRect(0,0,W,H);\n}\nfunction syncUI(){\n  applyOled();\n  rows.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',!!S[b.dataset.k]));\n  rows.querySelectorAll('.seg').forEach(s=>s.querySelectorAll('button').forEach(b=>b.classList.toggle('on',S[s.dataset.k]===b.dataset.v)));\n  rows.querySelectorAll('.pad button').forEach(b=>b.classList.toggle('on',+b.dataset.i===S.gi));\n  rows.querySelectorAll('input[type=range][data-k]').forEach(r=>{r.value=S[r.dataset.k];r.parentElement.querySelector('output').textContent=fmt(+r.value)});\n  syncColorUI();\n}\n\nrows.addEventListener('click',async e=>{\n  const b=e.target.closest('button');if(!b)return;\n  const par=b.parentElement;\n  if(b.classList.contains('sw')){\n    const k=b.dataset.k;\n    if(k==='tilt')await setTilt(!S.tilt);else S[k]=!S[k];\n  }else if(par.classList.contains('seg')){\n    S[par.dataset.k]=b.dataset.v;\n  }\n  else if(par.classList.contains('pad')){S.gi=+b.dataset.i;if(S.tilt)setTilt(false)}\n  else if(b.dataset.chip!==undefined)selC=+b.dataset.chip;\n  else if(b.dataset.cadd!==undefined){\n    if(S.colors.length<4){S.colors.push(ADD[S.colors.length].slice());selC=S.colors.length-1;updateColors();assignColors()}\n  }\n  else if(b.dataset.cdel!==undefined){\n    if(S.colors.length>1){S.colors.splice(selC,1);selC=Math.min(selC,S.colors.length-1);updateColors();assignColors()}\n  }\n  else if(b.dataset.a==='holes')holes.length=0;\n  else if(b.dataset.a==='clear'){\n    for(let i=0;i<n;i++) respawn(i);\n  }\n  else if(b.dataset.a==='reset'){setTilt(false);Object.assign(S,D);S.colors=D.colors.map(c=>c.slice());selC=0;updateColors();assignColors()}\n  syncUI();save();\n});\n\nrows.addEventListener('input',e=>{\n  const r=e.target;if(r.type!=='range')return;\n  if(r.dataset.ch!==undefined){S.colors[selC][+r.dataset.ch]=+r.value;updateColors();syncColorUI();save();return}\n  S[r.dataset.k]=+r.value;\n  r.parentElement.querySelector('output').textContent=fmt(+r.value);\n  if(['cSat','cBri'].includes(r.dataset.k))updateColors();\n  if(r.dataset.k==='size'){\n    for(let i=0;i<n;i++) SZ[i]=S.size*rnd(.6,1.3);\n  }\n  save();\n});\n\ndocument.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{\n  tool=b.dataset.t;\n  document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b));\n});\n$('#mixTop').onclick=()=>{for(let i=0;i<n;i++)respawn(i);};\n$('#gear').onclick=()=>sheet.classList.toggle('open');\n$('#x').onclick=()=>sheet.classList.remove('open');\n\nsyncUI();\nsyncParticleCount();\nrequestAnimationFrame(frame);\n})();\n<\/script>\n<\/body>\n<\/html>\n";
